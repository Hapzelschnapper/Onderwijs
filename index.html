function renderMcQuiz(questions, title){
  const wrapId = 'mcq-' + Math.random().toString(36).slice(2,8);
  setTimeout(()=>initMcQuiz(wrapId, questions), 0);
  return `<div id="${wrapId}">
    <div class="quiz-card">
      <div class="quiz-meta"><span data-role="mcq-score">Score: 0 / 0</span></div>
      <p class="quiz-question" data-role="mcq-text"></p>
      <div class="options" data-role="mcq-options"></div>
      <p class="feedback" data-role="mcq-feedback"></p>
      <button class="next-btn" data-role="mcq-next">Volgende vraag →</button>
    </div>
  </div>`;
}
function initMcQuiz(wrapId, questions){
  const root = document.getElementById(wrapId);
  if(!root) return;
  const scoreEl = root.querySelector('[data-role="mcq-score"]');
  const textEl = root.querySelector('[data-role="mcq-text"]');
  const optsEl = root.querySelector('[data-role="mcq-options"]');
  const feedbackEl = root.querySelector('[data-role="mcq-feedback"]');
  const nextBtn = root.querySelector('[data-role="mcq-next"]');
  let score=0, total=0, current=null, lastQ=null;

  function pick(){
    let q;
    do { q = questions[Math.floor(Math.random()*questions.length)]; } while(questions.length>1 && q===lastQ);
    lastQ = q;
    return q;
  }
  function next(){
    current = pick();
    textEl.textContent = current.q;
    feedbackEl.textContent=''; feedbackEl.className='feedback';
    nextBtn.classList.remove('show');
    optsEl.innerHTML = '';
    optsEl.style.display = 'grid';
    shuffle([...current.options]).forEach(opt=>{
      const b = document.createElement('button');
      b.className='opt'; b.textContent=opt;
      b.addEventListener('click', ()=>answer(opt,b));
      optsEl.appendChild(b);
    });
    scoreEl.textContent = `Score: ${score} / ${total}`;
  }
  function answer(val, btn){
    const isCorrect = val===current.correct;
    total++; if(isCorrect) score++;
    Array.from(optsEl.children).forEach(b=>{
      b.disabled=true;
      if(b.textContent===current.correct) b.classList.add('correct');
      else if(b===btn) b.classList.add('wrong');
    });
    feedbackEl.textContent = isCorrect ? 'Goed zo!' : (current.explain ? `Niet helemaal — ${current.explain}` : `Niet helemaal — het juiste antwoord was "${current.correct}".`);
    feedbackEl.className = 'feedback ' + (isCorrect?'good':'bad');
    scoreEl.textContent = `Score: ${score} / ${total}`;
    nextBtn.classList.add('show');
  }
  nextBtn.addEventListener('click', next);
  next();
}

function renderMatchingGame(){
  return `<div data-role="match-wrap">
    <p class="quiz-meta" style="margin-bottom:10px;">Tik een hoofdletter en de bijbehorende kleine letter.</p>
    <div class="match-grid" data-role="match-grid"></div>
    <p class="feedback" data-role="match-feedback" style="margin-top:14px;"></p>
    <button class="next-btn show" data-role="match-again" style="display:none;">Nog een rondje →</button>
  </div>`;
}

function initMatchingGame(container){
  const PAIR_COUNT = 6;
  const grid = container.querySelector('[data-role="match-grid"]');
  const feedback = container.querySelector('[data-role="match-feedback"]');
  const againBtn = container.querySelector('[data-role="match-again"]');

  function start(){
    feedback.textContent = ''; feedback.className='feedback';
    againBtn.style.display = 'none';
    const chosen = shuffle([...EL_ALFABET]).slice(0, PAIR_COUNT);
    const tiles = shuffle([
      ...chosen.map(l=>({ key:l.name, form:'upper', text:l.upper })),
      ...chosen.map(l=>({ key:l.name, form:'lower', text: l.name==='sigma' ? 'σ' : l.lower }))
    ]);
    let matchedCount = 0;
    let firstPick = null;
    grid.innerHTML = '';
    const tileEls = tiles.map((t,i)=>{
      const btn = document.createElement('button');
      btn.className = 'match-tile';
      btn.textContent = t.text;
      btn.addEventListener('click', ()=>handlePick(i, btn));
      grid.appendChild(btn);
      return btn;
    });
    function handlePick(i, btn){
      if(btn.disabled || btn.classList.contains('selected')) return;
      if(firstPick===null){
        firstPick = {i, btn};
        btn.classList.add('selected');
        return;
      }
      if(firstPick.i===i) return;
      const a = tiles[firstPick.i], b = tiles[i];
      const isMatch = a.key===b.key && a.form!==b.form;
      if(isMatch){
        firstPick.btn.classList.remove('selected');
        firstPick.btn.classList.add('matched');
        btn.classList.add('matched');
        firstPick.btn.disabled = true; btn.disabled = true;
        matchedCount++;
        firstPick = null;
        if(matchedCount===PAIR_COUNT){
          feedback.textContent = 'Goed gedaan — alle paren gevonden!';
          feedback.className = 'feedback good';
          againBtn.style.display = 'inline-block';
        }
      } else {
        btn.classList.add('wrong-flash');
        firstPick.btn.classList.add('wrong-flash');
        const prevBtn = firstPick.btn;
        setTimeout(()=>{
          btn.classList.remove('wrong-flash');
          prevBtn.classList.remove('wrong-flash','selected');
        }, 500);
        firstPick = null;
      }
    }
  }
  againBtn.addEventListener('click', start);
  start();
}

/* ================= GENERIC OEFENEN ENGINE ================= */
// Turns "Wie alt ist deine Mutter / dein Vater?" into the two full, valid
// sentences ["Wie alt ist deine Mutter?", "Wie alt ist dein Vater?"] instead
// of naively chopping the string in half at "/" (which would wrongly split
// off a bare sentence fragment like "dein Vater?" as if it were a complete
// answer on its own). When there's no shared context to preserve — e.g.
// "oft / häufig" — it just returns the two standalone words/phrases.
function splitAlternatives(s){
  if(!s.includes('/')) return [s];
  const bits = s.split('/');
  if(bits.length !== 2) return [s];
  const left = bits[0].trim(), right = bits[1].trim();
  if(!left || !right) return [s];
  // Als de linkerkant al op zichzelf een complete zin is (eindigt op . ! ?),
  // zijn dit twee losstaande volledige alternatieven — niet samenvoegen.
  if(/[.!?]$/.test(left)) return [left, right];
  const leftWords = left.split(/\s+/);
  const rightWords = right.split(/\s+/);
  const lastRight = rightWords[rightWords.length-1];
  const m = lastRight.match(/^(.*?)([?.!,;:]*)$/);
  const rightCoreWords = rightWords.slice(0,-1).concat(m[1] ? [m[1]] : []);
  const suffix = m[2] || '';
  const n = rightCoreWords.length;
  if(n===0) return [left, right];
  let result;
  if(leftWords.length <= n){
    // Gedeeld STAARTwoord (bijv. "in/ naar Nederland" -> "in Nederland" / "naar Nederland"):
    // links is korter, dus de laatste woorden van rechts vormen een gedeelde staart.
    const sharedTail = rightCoreWords.slice(leftWords.length);
    const altRight = rightCoreWords.slice(0, leftWords.length);
    const tailStr = sharedTail.length ? ' ' + sharedTail.join(' ') : '';
    result = [
      leftWords.join(' ') + tailStr + suffix,
      altRight.join(' ') + tailStr + suffix
    ];
  } else {
    const altLeft = leftWords.slice(leftWords.length-n);
    const prefixWords = leftWords.slice(0, leftWords.length-n);
    result = [
      [...prefixWords, ...altLeft].join(' ') + suffix,
      [...prefixWords, ...rightCoreWords].join(' ') + suffix
    ];
  }
  // Veiligheidscheck: als het samenvoegen een herhaald woord oplevert (bijv.
  // "ik ik drum"), was de aanname over een gedeeld voor-/staartstuk fout —
  // val dan terug op de twee kanten los, zonder samenvoegen.
  const hasDupe = result.some(r => /\b(\w+)\s+\1\b/i.test(r));
  if(hasDupe) return [left, right];
  return result;
}
function normalizeNl(nl){
  const cleaned = nl.replace(/\([^)]*\)/g,'');
  const out = [];
  if(cleaned.includes('/')){
    // Bevat de tekst een "/", behandel 'm als één geheel (het kan een volledige
    // zin met een komma erin zijn — die komma is dan gewone interpunctie, geen
    // synoniem-scheiding).
    splitAlternatives(cleaned.trim()).forEach(v=>{ if(v) out.push(v.trim().toLowerCase()); });
  } else {
    // Geen "/": een komma scheidt hier wél synoniemen (bijv. "veelkleurig, bont").
    cleaned.split(',').map(s=>s.trim()).filter(Boolean).forEach(part=>{
      out.push(part.toLowerCase());
    });
  }
  return out;
}
function normAnswer(s){ return s.trim().toLowerCase(); }

/* ================= SRS (Leitner) — alleen voor woorden/letters, niet voor vervoegingen/naamvallen ================= */
const SRS_STORAGE_KEY = 'talenapp_srs_v1';
const SRS_INTERVALS_DAYS = [0,1,2,4,7,14]; // index = box (0..5)
function srsLoadAll(){
  try{ return JSON.parse(localStorage.getItem(SRS_STORAGE_KEY) || '{}'); } catch(e){ return {}; }
}
function srsSaveAll(store){
  try{ localStorage.setItem(SRS_STORAGE_KEY, JSON.stringify(store)); } catch(e){ /* opslag niet beschikbaar, negeren */ }
}
function srsToday(){ return new Date().toISOString().slice(0,10); }
function srsKeyFor(langCode, word){ return `${langCode}|${word.target}|${word.nl}`; }
function srsIsDue(langCode, word){
  const store = srsLoadAll();
  const rec = store[srsKeyFor(langCode, word)];
  if(!rec) return true;
  return rec.due <= srsToday();
}
function srsRecord(langCode, word, correct){
  const store = srsLoadAll();
  const key = srsKeyFor(langCode, word);
  const rec = store[key] || { box:0, due: srsToday() };
  rec.box = correct ? Math.min(rec.box+1, SRS_INTERVALS_DAYS.length-1) : 0;
  const d = new Date();
  d.setDate(d.getDate() + SRS_INTERVALS_DAYS[rec.box]);
  rec.due = d.toISOString().slice(0,10);
  store[key] = rec;
  srsSaveAll(store);
}

function initOefenen(wrapId, cats, questionTemplate, lemmaFn, describeForm, mcOnly, noHints, langCode){
  const root = document.getElementById(wrapId);
  if(!root) return;
  const catGrid = root.querySelector('[data-role="cat-grid"]');
  const wordGrid = root.querySelector('[data-role="word-grid"]');
  const wordlistWrap = root.querySelector('[data-role="wordlist-wrap"]');
  const dirToggle = root.querySelector('[data-role="dir-toggle"]');
  const quizArea = root.querySelector('[data-role="quiz-area"]');
  const questionText = root.querySelector('[data-role="question-text"]');
  const hintText = root.querySelector('[data-role="hint-text"]');
  const optionsEl = root.querySelector('[data-role="options"]');
  const inputRow = root.querySelector('[data-role="input-row"]');
  const textInput = root.querySelector('[data-role="text-input"]');
  const checkBtn = root.querySelector('[data-role="check-btn"]');
  const feedbackEl = root.querySelector('[data-role="feedback"]');
  const nextBtn = root.querySelector('[data-role="next-btn"]');
  const elKeyboardSlot = root.querySelector('[data-role="el-keyboard-slot"]');
  const scoreDisplay = root.querySelector('[data-role="score-display"]');
  const streakDisplay = root.querySelector('[data-role="streak-display"]');

  let catKey = null;
  let direction = 'both';
  let score=0,total=0,streak=0,current=null,hintTaps=0;

  Object.keys(cats).forEach(key=>{
    const cat = cats[key];
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.innerHTML = `<strong>${cat.title}</strong><span>${cat.sub} — ${cat.words.length} woorden</span>`;
    btn.addEventListener('click', ()=>selectCategory(key));
    if(catGrid) catGrid.appendChild(btn);
  });

  Array.from(dirToggle.querySelectorAll('.dir-btn')).forEach(b=>{
    b.addEventListener('click', ()=>{
      direction = b.dataset.dir;
      Array.from(dirToggle.querySelectorAll('.dir-btn')).forEach(x=>x.classList.toggle('active', x===b));
      nextQuestion();
    });
  });

  function selectCategory(key){
    catKey = key;
    if(catGrid) Array.from(catGrid.children).forEach((b,i)=>b.classList.toggle('active', Object.keys(cats)[i]===key));
    const cat = cats[key];
    wordGrid.innerHTML = cat.words.map(w=>`<div><b>${lemmaFn(w)}</b> — ${w.nl}</div>`).join('');
    wordlistWrap.open = false;
    dirToggle.style.display = 'flex';
    quizArea.style.display = 'block';
    score=0; total=0; streak=0;
    updateScore();
    nextQuestion();
  }

  function updateScore(){
    const scoreDisp = Number.isInteger(score) ? score : score.toFixed(1);
    scoreDisplay.textContent = `Score: ${scoreDisp} / ${total}`;
    streakDisplay.textContent = `Reeks: ${streak}`;
  }

  function pickWord(){
    const cat = cats[catKey];
    if(cat.vocabOnly && cat.srsLang){
      const due = cat.words.filter(w=>srsIsDue(cat.srsLang, w));
      const pool = due.length ? due : cat.words;
      return pool[Math.floor(Math.random()*pool.length)];
    }
    return cat.words[Math.floor(Math.random()*cat.words.length)];
  }

  function buildVormQuestion(){
    const cat = cats[catKey];
    const word = pickWord();
    const forms = cat.forms(word);
    const formKeys = Object.keys(forms).filter(k=>k!=='gender');
    const formKey = formKeys[Math.floor(Math.random()*formKeys.length)];
    const correct = forms[formKey];
    const allValues = Array.from(new Set(formKeys.map(k=>forms[k])));
    const wrongPool = shuffle(allValues.filter(v=>v!==correct));
    const altLookup = {};
    if(describeForm){
      formKeys.forEach(k=>{
        if(k===formKey) return;
        const val = forms[k];
        if(normAnswer(val)===normAnswer(correct)) return;
        altLookup[normAnswer(val)] = `"${val}" is de ${describeForm(word,k,forms)}`;
      });
    }
    return {
      type:'vorm',
      questionHTML: questionTemplate(word, formKey, forms),
      correct,
      mcOptions: shuffle([correct, ...wrongPool.slice(0,3)]),
      accept: (val)=> ({ ok: normAnswer(val)===normAnswer(correct), typo:false }),
      altLookup
    };
  }

  function buildVertaalQuestion(){
    const cat = cats[catKey];
    if(cat.vertaalFn){
      return Object.assign({type:'vertaal'}, cat.vertaalFn());
    }
    const word = pickWord();
    const lemma = lemmaFn(word);
    const correct = word.nl;
    const others = cat.words.filter(w=>w!==word);
    const wrongPool = shuffle(others.map(w=>w.nl));
    const altLookup = {};
    others.forEach(w2=>{
      normalizeNl(w2.nl).forEach(m=>{ altLookup[m] = `"${lemmaFn(w2)}" betekent "${w2.nl}"`; });
    });
    return {
      type:'vertaal',
      questionHTML: `Wat betekent <span class="w">${lemma}</span>?`,
      correct,
      mcOptions: shuffle([correct, ...wrongPool.slice(0,3)]),
      accept: (val)=> ({ ok: normalizeNl(correct).includes(normAnswer(val)), typo:false }),
      altLookup
    };
  }

  function buildVocabQuestion(dirType){
    const cat = cats[catKey];
    const word = pickWord();
    const itemWord = cat.itemLabel==='letter' ? 'de letter' : 'het woord';
    const others = cat.words.filter(w=>w!==word);
    const altLookup = {};
    if(dirType==='t2nl'){
      const correct = word.nl;
      const wrongPool = shuffle(others.map(w=>w.nl));
      others.forEach(w2=>{ normalizeNl(w2.nl).forEach(m=>{ altLookup[m] = `"${lemmaFn(w2)}" betekent "${w2.nl}"`; }); });
      return {
        type:'vertaal',
        word,
        questionHTML: `Wat betekent <span class="w">${lemmaFn(word)}</span>?`,
        correct,
        mcOptions: shuffle([correct, ...wrongPool.slice(0,3)]),
        accept: (v)=> ({ ok: normalizeNl(correct).includes(normAnswer(v)), typo:false }),
        altLookup,
        bonusInfo: word.bonus
      };
    }
    const correct = lemmaFn(word);
    const wrongPool = shuffle(others.map(w=>lemmaFn(w)));
    others.forEach(w2=>{ altLookup[normAnswer(lemmaFn(w2))] = `"${lemmaFn(w2)}" betekent "${w2.nl}"`; });
    return {
      type:'vertaal',
      word,
      questionHTML: `Wat is ${itemWord} voor <span class="w">${word.nl}</span>?`,
      correct,
      mcOptions: shuffle([correct, ...wrongPool.slice(0,3)]),
      accept: (v)=> ({ ok: splitAlternatives(correct).some(alt=>normAnswer(alt)===normAnswer(v)), typo:false }),
      altLookup,
      bonusInfo: word.bonus
    };
  }

  function nextQuestion(){
    const cat = cats[catKey];
    let type;
    if(cat.vocabOnly){
      if(direction==='nl2target') type='vocab_nl2t';
      else if(direction==='target2nl') type='vocab_t2nl';
      else type = Math.random()<0.5 ? 'vocab_nl2t' : 'vocab_t2nl';
      current = buildVocabQuestion(type==='vocab_nl2t' ? 'nl2t' : 't2nl');
    } else {
      if(direction==='nl2target') type='vorm';
      else if(direction==='target2nl') type='vertaal';
      else type = Math.random()<0.5 ? 'vorm' : 'vertaal';
      current = type==='vorm' ? buildVormQuestion() : buildVertaalQuestion();
    }
    current.answerMode = mcOnly ? 'mc' : (Math.random()<(1/3) ? 'mc' : 'input');
    hintTaps = 0;

    questionText.innerHTML = current.questionHTML;
    hintText.textContent = '';
    feedbackEl.textContent=''; feedbackEl.className='feedback';
    nextBtn.classList.remove('show');
    textInput.value=''; textInput.disabled=false;
    checkBtn.disabled=false;

    const wEl = questionText.querySelector('.w');
    if(wEl && !noHints){
      wEl.classList.add('hintable');
      wEl.title = 'Tik voor een hint';
      wEl.addEventListener('click', onHintTap);
    }

    if(current.answerMode==='mc'){
      inputRow.style.display='none';
      if(elKeyboardSlot) elKeyboardSlot.innerHTML = '';
      optionsEl.style.display='grid';
      optionsEl.innerHTML = '';
      current.mcOptions.forEach(opt=>{
        const b = document.createElement('button');
        b.className = 'opt'; b.textContent = opt;
        b.addEventListener('click', ()=>checkAnswer(opt,b));
        optionsEl.appendChild(b);
      });
    } else {
      optionsEl.style.display='none';
      optionsEl.innerHTML = '';
      inputRow.style.display='flex';
      if(elKeyboardSlot){
        if(langCode==='EL') wireElKeyboard(elKeyboardSlot, textInput);
        else elKeyboardSlot.innerHTML = '';
      }
    }
  }

  function onHintTap(){
    hintTaps++;
    let shown=0, out='';
    for(const ch of current.correct){
      if(/[a-zA-ZÀ-ÿ]/.test(ch)){
        shown++;
        out += shown<=hintTaps ? ch : '_';
      } else {
        out += ch;
      }
    }
    hintText.textContent = 'Hint: ' + out;
  }

  function submitInput(){
    if(textInput.disabled) return;
    checkAnswer(textInput.value, null);
  }
  checkBtn.addEventListener('click', submitInput);
  textInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submitInput(); });

  function checkAnswer(chosen, btnEl){
    total++;
    let isCorrect=false, altMsg=null;
    if(current.answerMode==='mc'){
      isCorrect = (chosen===current.correct);
    } else {
      const normChosen = normAnswer(chosen);
      const knownAlt = current.altLookup && current.altLookup[normChosen];
      const match = current.accept(chosen);
      if(match.ok){
        isCorrect = true;
      } else if(knownAlt){
        isCorrect = false; altMsg = knownAlt;
      } else {
        isCorrect = false;
      }
    }
    if(current.answerMode==='mc'){
      Array.from(optionsEl.children).forEach(b=>b.disabled=true);
      if(btnEl) btnEl.classList.add(isCorrect?'correct':'wrong');
      if(!isCorrect){
        Array.from(optionsEl.children).forEach(b=>{ if(b.textContent===current.correct) b.classList.add('correct'); });
      }
    } else {
      textInput.disabled=true; checkBtn.disabled=true;
    }

    let credit, reason;
    if(isCorrect){
      if(hintTaps===0) credit='full';
      else if(hintTaps===1) credit='half';
      else { credit='none'; reason='toomanyhints'; }
    } else {
      credit='none'; reason='wrong';
    }

    if(credit==='full'){
      score++; streak++;
      feedbackEl.textContent = current.bonusInfo ? `Goed zo! (dit betekent: "${current.bonusInfo}")` : 'Goed zo!';
      feedbackEl.className='feedback good';
    } else if(credit==='half'){
      score += 0.5; streak=0;
      feedbackEl.textContent = current.bonusInfo ? `Half goed — je gebruikte een hint. (dit betekent: "${current.bonusInfo}")` : 'Half goed — je gebruikte een hint.';
      feedbackEl.className='feedback good';
    } else if(reason==='toomanyhints'){
      streak=0;
      feedbackEl.textContent = current.bonusInfo ? `Goed zo! (dit betekent: "${current.bonusInfo}")` : 'Goed zo!';
      feedbackEl.className='feedback good';
    } else {
      streak=0;
      let msg = `Niet helemaal — het juiste antwoord is "${current.correct}".`;
      if(altMsg){
        msg = `Fout — ${altMsg}, juist is: "${current.correct}".`;
      } else if(current.answerMode==='input' && current.altLookup){
        const alt = current.altLookup[normAnswer(chosen)];
        if(alt) msg = `Fout — ${alt}, juist is: "${current.correct}".`;
      }
      feedbackEl.textContent = msg;
      feedbackEl.className='feedback bad';
    }
    updateScore();
    nextBtn.classList.add('show');
  }

  nextBtn.addEventListener('click', nextQuestion);
  selectCategory(Object.keys(cats)[0]);
}

/* ================= MASTER RENDER ================= */
function normWords(words, key){
  return words.map(w=>({ target:w[key], nl:w.nl, bonus:w.bonus }));
}

function frReorderSubs(subs, hstNum){
  const lettered = subs.filter(s=>/^Paragraaf [a-zA-Z]$/.test(s.title));
  const others = subs.filter(s=>!/^Paragraaf [a-zA-Z]$/.test(s.title));

  // Voeg kleine/grote letter-varianten van dezelfde paragraaf samen (1.a en 1.A zijn dezelfde paragraaf).
  const byLetter = {};
  const order = [];
  lettered.forEach(s=>{
    const letter = s.title.slice(-1).toUpperCase();
    if(!byLetter[letter]){ byLetter[letter] = []; order.push(letter); }
    byLetter[letter].push(...s.words);
  });
  order.sort();
  const renumbered = order.map(letter=>{
    const seen = new Set(); const ded = [];
    byLetter[letter].forEach(w=>{
      const k = w.target + '|' + w.nl;
      if(seen.has(k)) return;
      seen.add(k); ded.push(w);
    });
    return { title:`${hstNum}.${letter}`, words: ded };
  });

  others.sort((a,b)=>{
    const rank = t => t.startsWith('Hele hoofdstuk') ? 2 : (t==='Phrases-clés' ? 1 : 0);
    return rank(a.title)-rank(b.title);
  });
  return [...renumbered, ...others];
}

function elLetterWords(){
  const out = [];
  EL_ALFABET.forEach(l=>{
    out.push({ target:l.upper, nl:l.name });
    if(l.name==='sigma'){
      out.push({ target:'σ', nl:l.name });
      out.push({ target:'ς', nl:l.name });
    } else {
      out.push({ target:l.lower, nl:l.name });
    }
  });
  return out;
}

const SPECIAL_CONTENT = {
  'la-nouns': { leren:laNounLeren, oefenen:laNounOefenen },
  'la-verbs': { leren:laVerbLeren, oefenen:laVerbOefenen },
  'de-nouns': { leren:deNounLeren, oefenen:deNounOefenen },
  'de-verbs': { leren:deVerbLeren, oefenen:deVerbOefenen },
  'fr-verbs': { leren:frVerbLeren, oefenen:frVerbOefenen }
};

function getChapters(lang){
  const chapters = [];
  const vt = (title)=> title;
  if(lang==='la'){
    chapters.push({ id:'la-nouns', title:'Naamvallen', special:'la-nouns' });
    chapters.push({ id:'la-verbs', title:'Vervoegingen', special:'la-verbs' });
    LA_VOCAB.forEach((c,ci)=>{
      chapters.push({ id:'c'+ci, title:c.title, subs: c.subs.map(s=>({ title:vt(s.title), words: normWords(s.words,'lat') })) });
    });
  } else if(lang==='de'){
    chapters.push({ id:'de-nouns', title:'Naamvallen', special:'de-nouns' });
    chapters.push({ id:'de-verbs', title:'Vervoegingen', special:'de-verbs' });
    const DE_LES_BY_HST = {
      '1': [
        { title:'Les: Werkwoorden & voornaamwoord', words:[], richLeren: deLes_PersoonlijkWerkwoord },
        { title:'Les: Haben en sein', words:[], richLeren: deLes_HabenSein },
        { title:'Les: Het lidwoord', words:[], richLeren: deLes_Lidwoord },
        { title:'Les: Bezittelijk voornaamwoord', words:[], richLeren: deLes_Bezittelijk }
      ],
      '2': [
        { title:'Les: Werkwoorden met s-klank', words:[], richLeren: deLes_SKlank },
        { title:'Les: Werkwoorden op -d/-t', words:[], richLeren: deLes_StamDT },
        { title:'Les: Persoonlijk voornaamwoord (vervanging)', words:[], richLeren: deLes_PersVervanging },
        { title:'Les: Geslacht van het zelfstandig naamwoord', words:[], richLeren: deLes_Geslacht }
      ]
    };
    DE_VOCAB.forEach((c,ci)=>{
      const hstNum = String(ci+1);
      const vocabSubs = c.subs.map(s=>({ title:vt(s.title), words: normWords(s.words,'de') }));
      const lesSubs = DE_LES_BY_HST[hstNum] || [];
      chapters.push({ id:'c'+ci, title:c.title, subs: [...lesSubs, ...vocabSubs] });
    });
  } else if(lang==='fr'){
    chapters.push({ id:'fr-verbs', title:'Vervoegingen', special:'fr-verbs' });
    FR_VOCAB.forEach((c,ci)=>{
      const hstNum = (c.title.match(/\d+/) || [String(ci+1)])[0];
      const rawSubs = c.subs.map(s=>({ title:s.title, words: normWords(s.words,'fr') }));
      const reordered = frReorderSubs(rawSubs, hstNum);
      const subs = reordered.map(s=>({
        title: (s.title==='Phrases-clés' || s.title.startsWith('Hele hoofdstuk')) ? s.title : vt(s.title),
        words: s.words
      }));
      chapters.push({ id:'c'+ci, title:c.title, subs });
    });
  } else if(lang==='el'){
    chapters.push({ id:'el-alf', title:'H1/2: het alfabet', subs:[{ title:'H1/2: het alfabet', words: elLetterWords(), itemLabel:'letter', matching:true, richLeren: elAlfabetLeren }] });
    EL_VOCAB2.forEach(c=>{
      const topics = EL_TOPICS_BY_HST[c.hst] || [];
      const subs = [];
      c.texts.forEach(t=>{
        const letter = t.title.slice(-1);
        subs.push({ title: t.title, words: normWords(t.words,'gr') });
        topics.filter(tp=>tp.after===letter).forEach(tp=>{
          subs.push({ title: tp.title, words: [], richLeren: tp.richLeren, richOefenen: tp.richOefenen });
        });
      });
      chapters.push({ id:'c'+c.hst, title:`Hoofdstuk ${c.hst}`, subs });
    });
  }
  return chapters;
}

let lessenSelection = null; // null | {special:id} | {ci,si}
let oefenSpecialView = null; // null | 'la-nouns' | 'la-verbs' | ...

function renderLessen(){
  const chapters = getChapters(currentLang);
  if(lessenSelection){
    return renderLessonDetail(chapters);
  }
  const wrapId = 'lessen-' + Math.random().toString(36).slice(2,8);
  setTimeout(()=>initLessenList(wrapId, chapters), 0);
  const blocks = chapters.map((c,ci)=>{
    if(c.special){
      return `<div class="chapter-block"><button class="chapter-header" data-ci="${ci}" data-special="1"><strong>${c.title}</strong></button></div>`;
    }
    if(c.subs.length===1){
      return `<div class="chapter-block"><button class="chapter-header" data-ci="${ci}" data-leaf="1"><strong>${c.title}</strong></button></div>`;
    }
    return `<div class="chapter-block">
      <button class="chapter-header" data-ci="${ci}"><strong>${c.title}</strong><span class="chapter-arrow">▾</span></button>
      <div class="chapter-subs" data-ci="${ci}" style="display:none;">
        ${c.subs.map((s,si)=>`<button class="sub-btn" data-ci="${ci}" data-si="${si}">${s.title}</button>`).join('')}
      </div>
    </div>`;
  }).join('');
  return `<div id="${wrapId}">
    <h2>Lessen</h2>
    ${blocks}
  </div>`;
}

function initLessenList(wrapId, chapters){
  const root = document.getElementById(wrapId);
  if(!root) return;
  root.querySelectorAll('.chapter-header').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const ci = +btn.dataset.ci;
      if(btn.dataset.special){
        lessenSelection = { special: chapters[ci].special };
        render();
        return;
      }
      if(btn.dataset.leaf){
        lessenSelection = { ci, si:0 };
        render();
        return;
      }
      const subsEl = root.querySelector(`.chapter-subs[data-ci="${ci}"]`);
      const opening = subsEl.style.display === 'none';
      subsEl.style.display = opening ? 'flex' : 'none';
      btn.classList.toggle('open', opening);
    });
  });
  root.querySelectorAll('.sub-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      lessenSelection = { ci:+btn.dataset.ci, si:+btn.dataset.si };
      render();
    });
  });
}

function renderLessonDetail(chapters){
  const wrapId = 'lesdet-' + Math.random().toString(36).slice(2,8);
  setTimeout(()=>initLessonDetail(wrapId, chapters), 0);

  if(lessenSelection.special){
    const sc = SPECIAL_CONTENT[lessenSelection.special];
    return `<div id="${wrapId}">
      <button class="back-btn" data-role="lessen-back" style="display:inline-block;">← Hoofdstukken</button>
      ${sc.leren()}
      <div style="margin-top:20px;"><button class="next-btn show" data-role="special-oefen">Oefenen →</button></div>
      <div data-role="special-quiz" style="margin-top:16px;"></div>
    </div>`;
  }

  const { ci, si } = lessenSelection;
  const c = chapters[ci], s = c.subs[si];
  const matchBtn = s.matching ? `<button class="next-btn show" data-role="matching-btn" style="margin-left:8px;">Matching-spel →</button>` : '';
  const oefenBtn = (s.words.length || s.richOefenen) ? `<button class="next-btn show" data-role="sub-oefen">Oefenen →</button>` : '';
  const bodyHtml = s.richLeren
    ? s.richLeren()
    : `<h3>${c.title} — ${s.title}</h3>
       <div class="table-scroll"><table><thead><tr><th>${LANG_NAMES[currentLang]}</th><th>Nederlands</th></tr></thead><tbody>${s.words.map(w=>`<tr><td>${w.target}</td><td>${w.nl}</td></tr>`).join('')}</tbody></table></div>`;
  return `<div id="${wrapId}">
    <button class="back-btn" data-role="lessen-back" style="display:inline-block;">← Hoofdstukken</button>
    ${bodyHtml}
    ${oefenBtn}${matchBtn}
    <div data-role="sub-quiz" style="margin-top:16px;"></div>
  </div>`;
}

function initLessonDetail(wrapId, chapters){
  const root = document.getElementById(wrapId);
  if(!root) return;
  root.querySelector('[data-role="lessen-back"]').addEventListener('click', ()=>{
    lessenSelection = null;
    render();
  });

  if(lessenSelection.special){
    const sc = SPECIAL_CONTENT[lessenSelection.special];
    root.querySelector('[data-role="special-oefen"]').addEventListener('click', ()=>{
      root.querySelector('[data-role="special-quiz"]').innerHTML = lessenSelection.special==='la-nouns' ? renderLaParseOefenen() : sc.oefenen();
    });
    return;
  }

  const { ci, si } = lessenSelection;
  const s = chapters[ci].subs[si];
  const oefenBtn = root.querySelector('[data-role="sub-oefen"]');
  if(oefenBtn){
    oefenBtn.addEventListener('click', ()=>{
      if(s.richOefenen){
        root.querySelector('[data-role="sub-quiz"]').innerHTML = s.richOefenen();
        return;
      }
      root.querySelector('[data-role="sub-quiz"]').innerHTML = renderOefenCategoryPicker(
        { one: { title:s.title, sub:'', words:s.words, vocabOnly:true, srsLang:currentLang, itemLabel:s.itemLabel } },
        null, (w)=>w.target, undefined, undefined, undefined, currentLang.toUpperCase()
      );
    });
  }
  if(s.matching){
    root.querySelector('[data-role="matching-btn"]').addEventListener('click', ()=>{
      const quizArea = root.querySelector('[data-role="sub-quiz"]');
      quizArea.innerHTML = renderMatchingGame();
      setTimeout(()=>initMatchingGame(quizArea), 0);
    });
  }
}

/* ================= OEFENEN & TOETS: SELECTIE ================= */
function renderSelect(mode){
  if(mode==='oefenen' && oefenSpecialView){
    return renderOefenSpecialDetail();
  }
  const allChapters = getChapters(currentLang);
  const specials = mode==='oefenen' ? allChapters.filter(c=>c.special) : [];
  const chapters = allChapters
    .filter(c=>!c.special)
    .map(c=>({ ...c, subs: c.subs.filter(s=>s.words.length>0) }))
    .filter(c=>c.subs.length>0);
  const wrapId = 'sel-' + Math.random().toString(36).slice(2,8);
  setTimeout(()=>initSelect(wrapId, chapters, mode, specials), 0);
  const specialBlocks = specials.map((c,si)=>`
    <div class="chapter-block">
      <button class="chapter-header" data-role="special-select" data-si="${si}"><strong>${c.title}</strong></button>
    </div>`).join('');
  const blocks = chapters.map((c,ci)=>{
    if(c.subs.length===1){
      return `<div class="chapter-block">
        <div class="chapter-header select-mode">
          <span class="chk-box" data-role="chk-chapter" data-ci="${ci}">✓</span>
          <strong style="flex:1;">${c.title}</strong>
        </div>
      </div>`;
    }
    return `<div class="chapter-block">
      <div class="chapter-header select-mode">
        <span class="chk-box" data-role="chk-chapter" data-ci="${ci}">✓</span>
        <strong style="flex:1;cursor:pointer;" data-role="chapter-toggle" data-ci="${ci}">${c.title}</strong>
        <span class="chapter-arrow" data-role="chapter-toggle" data-ci="${ci}" style="cursor:pointer;">▾</span>
      </div>
      <div class="chapter-subs" data-ci="${ci}" style="display:none;">
        ${c.subs.map((s,si)=>`
          <div class="sub-row">
            <span class="chk-box" data-role="chk-sub" data-ci="${ci}" data-si="${si}">✓</span>
            <span class="sub-btn" style="cursor:default;">${s.title}</span>
          </div>`).join('')}
      </div>
    </div>`;
  }).join('');
  const modeLabel = mode==='toets' ? 'Toets' : 'Oefenen';
  return `<div id="${wrapId}">
    <h2>${modeLabel} — kies paragrafen</h2>
    ${specials.length ? `<p style="color:var(--ink-faint);font-size:.85rem;">Grammatica-onderdelen:</p>${specialBlocks}<h3>Woordenschat per hoofdstuk</h3>` : ''}
    <p style="color:var(--ink-faint);font-size:.85rem;">Tik een hoofdstuk aan om alle paragrafen te selecteren, of klap open voor losse paragrafen.</p>
    ${blocks}
    <div data-role="select-footer" style="margin-top:20px;"></div>
  </div>`;
}

function renderOefenSpecialDetail(){
  const c = getChapters(currentLang).find(x=>x.special===oefenSpecialView);
  const wrapId = 'oefenspec-' + Math.random().toString(36).slice(2,8);
  setTimeout(()=>{
    const root = document.getElementById(wrapId);
    if(!root) return;
    root.querySelector('[data-role="oefenspec-back"]').addEventListener('click', ()=>{
      oefenSpecialView = null;
      render();
    });
  }, 0);
  const inner = oefenSpecialView==='la-nouns' ? renderLaParseOefenen() : SPECIAL_CONTENT[oefenSpecialView].oefenen();
  return `<div id="${wrapId}">
    <button class="back-btn" data-role="oefenspec-back" style="display:inline-block;">← Oefenen</button>
    ${inner}
  </div>`;
}

function initSelect(wrapId, chapters, mode, specials){
  const root = document.getElementById(wrapId);
  if(!root) return;
  const footer = root.querySelector('[data-role="select-footer"]');
  const selected = new Set();
  const subKey = (ci,si)=> ci+'-'+si;

  if(specials && specials.length){
    root.querySelectorAll('[data-role="special-select"]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const c = specials[+btn.dataset.si];
        oefenSpecialView = c.special;
        render();
      });
    });
  }

  function collectWords(){
    const words = []; let firstItemLabel;
    selected.forEach(key=>{
      const [ci,si] = key.split('-').map(Number);
      const s = chapters[ci].subs[si];
      if(firstItemLabel===undefined) firstItemLabel = s.itemLabel;
      words.push(...s.words);
    });
    return { words, itemLabel: firstItemLabel };
  }

  function updateFooter(){
    const { words, itemLabel } = collectWords();
    const itemNoun = itemLabel==='letter' ? (words.length===1?'letter':'letters') : 'woorden';
    if(mode==='oefenen'){
      footer.innerHTML = selected.size ? `<button class="next-btn show" data-role="start-btn">Start oefenen (${words.length} ${itemNoun} geselecteerd)</button>` : '';
      const startBtn = footer.querySelector('[data-role="start-btn"]');
      if(startBtn){
        startBtn.addEventListener('click', ()=>{
          let area = root.querySelector('[data-role="oefen-area"]');
          if(!area){ area = document.createElement('div'); area.dataset.role='oefen-area'; area.style.marginTop='20px'; root.appendChild(area); }
          area.innerHTML = renderOefenCategoryPicker(
            { sel: { title:'Geselecteerde paragrafen', sub:'', words, vocabOnly:true, srsLang:currentLang, itemLabel } },
            null, (w)=>w.target, undefined, undefined, undefined, currentLang.toUpperCase()
          );
        });
      }
    } else {
      if(!selected.size){ footer.innerHTML=''; return; }
      footer.innerHTML = `
        <div class="dir-toggle" style="display:flex;">
          <span class="dir-label">Richting:</span>
          <button class="dir-btn" data-dir="nl2target">NL → ${currentLang.toUpperCase()}</button>
          <button class="dir-btn" data-dir="target2nl">${currentLang.toUpperCase()} → NL</button>
          <button class="dir-btn active" data-dir="both">Beide</button>
        </div>
        <button class="next-btn show" data-role="start-toets" style="margin-top:12px;">Start toets (20 vragen)</button>
      `;
      let dir = 'both';
      footer.querySelectorAll('.dir-btn').forEach(b=>{
        b.addEventListener('click', ()=>{
          dir = b.dataset.dir;
          footer.querySelectorAll('.dir-btn').forEach(x=>x.classList.toggle('active', x===b));
        });
      });
      footer.querySelector('[data-role="start-toets"]').addEventListener('click', ()=>{
        const { words:w2, itemLabel:il2 } = collectWords();
        content.innerHTML = renderToetsRunner(w2, currentLang.toUpperCase(), il2, dir);
      });
    }
  }

  root.querySelectorAll('[data-role="chapter-toggle"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const ci = el.dataset.ci;
      const subsEl = root.querySelector(`.chapter-subs[data-ci="${ci}"]`);
      subsEl.style.display = subsEl.style.display==='none' ? 'flex' : 'none';
    });
  });

  root.querySelectorAll('[data-role="chk-chapter"]').forEach(chk=>{
    chk.addEventListener('click', ()=>{
      const ci = +chk.dataset.ci;
      const chap = chapters[ci];
      const allSelected = chap.subs.every((s,si)=>selected.has(subKey(ci,si)));
      chap.subs.forEach((s,si)=>{
        const key = subKey(ci,si);
        if(allSelected) selected.delete(key); else selected.add(key);
        const subChk = root.querySelector(`[data-role="chk-sub"][data-ci="${ci}"][data-si="${si}"]`);
        if(subChk) subChk.classList.toggle('checked', !allSelected);
      });
      chk.classList.toggle('checked', !allSelected);
      updateFooter();
    });
  });

  root.querySelectorAll('[data-role="chk-sub"]').forEach(chk=>{
    chk.addEventListener('click', ()=>{
      const ci = +chk.dataset.ci, si = +chk.dataset.si;
      const key = subKey(ci,si);
      if(selected.has(key)){ selected.delete(key); chk.classList.remove('checked'); }
      else { selected.add(key); chk.classList.add('checked'); }
      const chap = chapters[ci];
      const allSelected = chap.subs.every((s,si2)=>selected.has(subKey(ci,si2)));
      const chapChk = root.querySelector(`[data-role="chk-chapter"][data-ci="${ci}"]`);
      chapChk.classList.toggle('checked', allSelected);
      updateFooter();
    });
  });

  updateFooter();
}

/* ================= TOETS RUNNER ================= */
function renderToetsRunner(words, langCode, itemLabel, direction){
  const wrapId = 'toets-' + Math.random().toString(36).slice(2,8);
  setTimeout(()=>initToetsRunner(wrapId, words, langCode, itemLabel, direction), 0);
  return `<div id="${wrapId}">
    <div class="quiz-card">
      <div class="quiz-meta"><span data-role="toets-progress">Vraag 1 / 20</span><span data-role="toets-wrong">Fout: 0</span></div>
      <p class="quiz-question" data-role="tq-text"></p>
      <div class="options" data-role="tq-options"></div>
      <div class="input-row" data-role="tq-input-row" style="display:none;">
        <input type="text" class="text-input" data-role="tq-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Typ je antwoord...">
        <button class="check-btn" data-role="tq-check">Controleer</button>
      </div>
      <div data-role="el-keyboard-slot"></div>
      <p class="feedback" data-role="tq-feedback"></p>
      <button class="next-btn" data-role="tq-next">Volgende →</button>
    </div>
  </div>`;
}

function initToetsRunner(wrapId, words, langCode, itemLabel, direction){
  const root = document.getElementById(wrapId);
  if(!root) return;
  const progressEl = root.querySelector('[data-role="toets-progress"]');
  const wrongEl = root.querySelector('[data-role="toets-wrong"]');
  const textEl = root.querySelector('[data-role="tq-text"]');
  const optsEl = root.querySelector('[data-role="tq-options"]');
  const inputRow = root.querySelector('[data-role="tq-input-row"]');
  const inputEl = root.querySelector('[data-role="tq-input"]');
  const checkBtn = root.querySelector('[data-role="tq-check"]');
  const feedbackEl = root.querySelector('[data-role="tq-feedback"]');
  const nextBtn = root.querySelector('[data-role="tq-next"]');
  const elKeyboardSlot = root.querySelector('[data-role="el-keyboard-slot"]');

  // Elk woord komt hoogstens één keer voor in de toets.
  const wordPool = shuffle([...words]);
  const totalQ = Math.min(20, wordPool.length);
  const plan = direction==='both'
    ? shuffle([...Array(Math.ceil(totalQ/2)).fill('nl2target'), ...Array(Math.floor(totalQ/2)).fill('target2nl')])
    : Array(totalQ).fill(direction);

  let idx=0, wrong=0, current=null;
  const itemWord = itemLabel==='letter' ? 'de letter' : 'het woord';

  function buildQ(dir, word){
    const others = words.filter(w=>w!==word);
    if(dir==='target2nl'){
      const correct = word.nl;
      const wrongPool = shuffle(others.map(w=>w.nl));
      return { word, correct, questionHTML:`Wat betekent <span class="w">${word.target}</span>?`, mcOptions: shuffle([correct, ...wrongPool.slice(0,3)]) };
    }
    const correct = word.target;
    const wrongPool = shuffle(others.map(w=>w.target));
    return { word, correct, questionHTML:`Wat is ${itemWord} voor <span class="w">${word.nl}</span>?`, mcOptions: shuffle([correct, ...wrongPool.slice(0,3)]) };
  }

  function next(){
    if(idx>=totalQ){ showResult(); return; }
    current = buildQ(plan[idx], wordPool[idx]);
    current.mode = Math.random()<(1/3) ? 'mc' : 'input';
    progressEl.textContent = `Vraag ${idx+1} / ${totalQ}`;
    wrongEl.textContent = `Fout: ${wrong}`;
    textEl.innerHTML = current.questionHTML;
    feedbackEl.textContent=''; feedbackEl.className='feedback';
    nextBtn.classList.remove('show');
    inputEl.value=''; inputEl.disabled=false; checkBtn.disabled=false;
    if(current.mode==='mc'){
      inputRow.style.display='none';
      if(elKeyboardSlot) elKeyboardSlot.innerHTML = '';
      optsEl.style.display='grid';
      optsEl.innerHTML='';
      current.mcOptions.forEach(opt=>{
        const b=document.createElement('button');
        b.className='opt'; b.textContent=opt;
        b.addEventListener('click', ()=>answer(opt));
        optsEl.appendChild(b);
      });
    } else {
      optsEl.style.display='none'; optsEl.innerHTML='';
      inputRow.style.display='flex';
      if(elKeyboardSlot){
        if(langCode==='EL') wireElKeyboard(elKeyboardSlot, inputEl);
        else elKeyboardSlot.innerHTML = '';
      }
    }
  }

  function answer(val){
    const isCorrect = normAnswer(val)===normAnswer(current.correct);
    if(current.mode==='mc'){
      Array.from(optsEl.children).forEach(b=>{ b.disabled=true; if(b.textContent===current.correct) b.classList.add('correct'); else if(b.textContent===val && !isCorrect) b.classList.add('wrong'); });
    } else {
      inputEl.disabled=true; checkBtn.disabled=true;
    }
    if(!isCorrect) wrong++;
    srsRecord(langCode, current.word, isCorrect);
    feedbackEl.textContent = isCorrect ? 'Goed zo!' : `Niet helemaal — het juiste antwoord is "${current.correct}".`;
    feedbackEl.className = 'feedback ' + (isCorrect?'good':'bad');
    idx++;
    nextBtn.classList.add('show');
  }

  checkBtn.addEventListener('click', ()=>{ if(!inputEl.disabled) answer(inputEl.value); });
  inputEl.addEventListener('keydown', e=>{ if(e.key==='Enter' && !inputEl.disabled) answer(inputEl.value); });
  nextBtn.addEventListener('click', next);

  function showResult(){
    const wrongScaled = wrong * (20/totalQ);
    const cijfer = Math.max(1, Math.min(10, Math.round(10-wrongScaled)));
    root.innerHTML = `
      <div class="quiz-card" style="text-align:center;">
        <h2 style="margin-top:0;">Toets afgerond</h2>
        <p style="font-size:2rem;font-family:'Cinzel',serif;color:var(--gold);margin:10px 0;">Cijfer: ${cijfer}</p>
        <p style="color:var(--ink-dim);">${wrong} fout van de ${totalQ}</p>
        <button class="next-btn show" data-role="toets-again">Opnieuw</button>
        <button class="back-btn" data-role="toets-home" style="margin-left:8px;">Naar hoofdscherm</button>
      </div>`;
    root.querySelector('[data-role="toets-again"]').addEventListener('click', ()=>{ render(); });
    root.querySelector('[data-role="toets-home"]').addEventListener('click', ()=>{ currentScreen='home'; render(); });
  }

  next();
}

function render(){
  if(showStart){
    content.innerHTML = renderStartScreen();
    backBtn.style.display = 'none';
    return;
  }
  renderNav();
  let html = '';
  if(currentScreen==='home') html = renderLangHome();
  else if(currentScreen==='lessen') html = renderLessen();
  else if(currentScreen==='oefenen') html = renderSelect('oefenen');
  else if(currentScreen==='toets') html = renderSelect('toets');
  content.innerHTML = html;
}


render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('service-worker.js').catch(function(){});
  });
}
})();
</script>
