<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talen — Naamvallen &amp; Werkwoorden</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#221c15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Talen">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#221c15; --bg-edge:#161210; --card:#2c2419; --card-2:#332a1d;
    --ink:#f1e7d2; --ink-dim:#c7b998; --ink-faint:#96876a;
    --gold:#d9a441; --gold-dim:#a9803a;
    --nom:#c1453d; --gen:#d9a441; --dat:#5e8c6a; --acc:#4c7bb0; --abl:#a06fa3;
    --good:#5e8c6a; --bad:#c1453d; --radius:6px;
    --lang-la:#d1776a; --lang-la-dim:#a85a4f;
    --lang-de:#c9a15c; --lang-de-dim:#a17f42;
    --lang-fr:#7f9cc4; --lang-fr-dim:#5f7ba3;
    --lang-el:#6cb3b8; --lang-el-dim:#4f8d92;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background: radial-gradient(ellipse 1200px 800px at 50% -10%, var(--card) 0%, var(--bg) 55%, var(--bg-edge) 100%);
    background-color:var(--bg); color:var(--ink); font-family:'Nunito', sans-serif; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:26px 20px 80px;}
  header{text-align:center;margin-bottom:20px;}
  h1{font-family:'Cinzel',serif;font-weight:700;font-size:clamp(1.6rem, 5vw, 2.3rem);letter-spacing:0.5px;margin:0 0 6px;text-shadow:0 1px 0 rgba(0,0,0,.4);}
  .subtitle{color:var(--ink-dim);font-size:.95rem;margin:0 0 22px;font-style:italic;}

  nav.pillnav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  nav.pillnav button{
    font-family:'Nunito',sans-serif;font-weight:700;font-size:.92rem;color:var(--ink-dim);
    background:var(--card);border:1px solid rgba(217,164,65,0.25);border-radius:var(--radius);
    padding:9px 16px;cursor:pointer;transition:border-color .15s,color .15s,background .15s;
  }
  nav.pillnav button:hover{border-color:var(--gold-dim);color:var(--ink);}
  nav.pillnav button.active{background:var(--gold);color:#221c15;border-color:var(--gold);}
  #lang-nav button[data-id="la"].active{background:var(--lang-la);border-color:var(--lang-la);color:#221c15;}
  #lang-nav button[data-id="de"].active{background:var(--lang-de);border-color:var(--lang-de);color:#221c15;}
  #lang-nav button[data-id="fr"].active{background:var(--lang-fr);border-color:var(--lang-fr);color:#221c15;}
  #lang-nav button[data-id="el"].active{background:var(--lang-el);border-color:var(--lang-el);color:#221c15;}
  #lang-nav button[data-id="la"]:hover{border-color:var(--lang-la);}
  #lang-nav button[data-id="de"]:hover{border-color:var(--lang-de);}
  #lang-nav button[data-id="fr"]:hover{border-color:var(--lang-fr);}
  #lang-nav button[data-id="el"]:hover{border-color:var(--lang-el);}

  /* Retint the whole theme's gold accent to match the language currently being studied */
  body[data-lang="la"]{ --gold:var(--lang-la); --gold-dim:var(--lang-la-dim); }
  body[data-lang="de"]{ --gold:var(--lang-de); --gold-dim:var(--lang-de-dim); }
  body[data-lang="fr"]{ --gold:var(--lang-fr); --gold-dim:var(--lang-fr-dim); }
  body[data-lang="el"]{ --gold:var(--lang-el); --gold-dim:var(--lang-el-dim); }
  nav.pillnav.sub button{font-size:.85rem;padding:7px 14px;}
  nav.pillnav.sub2 button{font-size:.8rem;padding:6px 12px;background:transparent;}
  nav.pillnav.sub2 button.active{background:var(--gold-dim);color:#221c15;}
  button:focus-visible, a:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  main{margin-top:22px;}
  h2{font-family:'Cinzel',serif;font-weight:700;font-size:1.3rem;color:var(--gold);border-bottom:1px solid rgba(217,164,65,0.3);padding-bottom:8px;margin:32px 0 14px;}
  h2:first-child{margin-top:0;}
  h3{font-family:'Cinzel',serif;font-weight:600;font-size:1.05rem;color:var(--ink);margin:20px 0 8px;}
  p{margin:0 0 14px;color:var(--ink-dim);}
  strong{color:var(--ink);}
  em{color:inherit;}

  .card{background:var(--card);border:1px solid rgba(217,164,65,0.2);border-radius:var(--radius);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);padding:16px 18px;margin-bottom:16px;}
  .case-card{background:var(--card);border-left:4px solid var(--case-color, var(--gold));border-radius:0 var(--radius) var(--radius) 0;padding:12px 16px;margin-bottom:12px;}
  .case-card h3{margin:0 0 6px;color:var(--case-color, var(--gold));font-variant:small-caps;letter-spacing:.5px;}
  .case-card .func{color:var(--ink-dim);font-size:.9rem;margin-bottom:8px;}
  .ex{margin:6px 0;padding-left:14px;border-left:2px solid rgba(255,255,255,0.08);}
  .ex .la{color:var(--ink);font-style:italic;}
  .ex .la b{color:var(--case-color, var(--gold));font-style:normal;}
  .ex .nl{color:var(--ink-faint);font-size:.88rem;}

  table{width:100%;border-collapse:collapse;margin:10px 0 20px;font-size:.92rem;}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px;}
  .table-scroll table{margin:10px 2px 20px;}
  caption{text-align:left;color:var(--ink-dim);font-size:.82rem;margin-bottom:6px;font-style:italic;}
  th,td{padding:7px 9px;text-align:left;border-bottom:1px solid rgba(217,164,65,0.15);}
  thead th{font-family:'Cinzel',serif;font-weight:600;color:var(--ink);font-size:.82rem;border-bottom:1px solid var(--gold-dim);}
  tbody th{font-family:'Cinzel',serif;font-weight:600;font-size:.8rem;font-variant:small-caps;letter-spacing:.3px;color:var(--case-color);white-space:nowrap;}
  tbody td{color:var(--ink-dim);}
  tbody tr:last-child td, tbody tr:last-child th{border-bottom:none;}

  .note{background:var(--card-2);border:1px dashed rgba(217,164,65,0.35);border-radius:var(--radius);padding:12px 16px;font-size:.88rem;color:var(--ink-dim);margin:14px 0;}

  .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
  @media (max-width:520px){.cat-grid{grid-template-columns:1fr;}}
  .cat-btn{background:var(--card);border:1px solid rgba(217,164,65,0.25);border-radius:var(--radius);padding:14px;text-align:left;cursor:pointer;color:var(--ink);font-family:'Nunito',sans-serif;}
  .cat-btn strong{display:block;font-family:'Cinzel',serif;color:var(--gold);font-size:.95rem;margin-bottom:3px;}
  .cat-btn span{color:var(--ink-faint);font-size:.82rem;}
  .cat-btn:hover{border-color:var(--gold);}
  .cat-btn.active{border-color:var(--gold);background:var(--card-2);box-shadow:0 0 0 1px var(--gold);}

  details.wordlist{margin-bottom:18px;}
  details.wordlist summary{cursor:pointer;color:var(--gold);font-family:'Cinzel',serif;font-size:.9rem;padding:6px 0;}
  .word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 16px;margin-top:8px;font-size:.88rem;}
  .word-grid div{color:var(--ink-dim);border-bottom:1px solid rgba(255,255,255,.06);padding:4px 0;}
  .word-grid b{color:var(--ink);}

  .quiz-card{background:var(--card);border:1px solid var(--gold-dim);border-radius:var(--radius);padding:20px;}
  .dir-toggle{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .dir-label{font-size:.82rem;color:var(--ink-faint);}
  .dir-btn{font-family:'Nunito',sans-serif;font-weight:700;font-size:.8rem;color:var(--ink-dim);background:var(--card);border:1px solid rgba(217,164,65,0.25);border-radius:999px;padding:6px 14px;cursor:pointer;}
  .dir-btn:hover{border-color:var(--gold-dim);}
  .dir-btn.active{background:var(--gold);color:#221c15;border-color:var(--gold);}
  .input-row{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  .check-btn{align-self:flex-start;}
  .text-input{flex:1;font-family:'Nunito',sans-serif;font-size:1rem;background:var(--card-2);border:1px solid rgba(217,164,65,0.3);color:var(--ink);border-radius:var(--radius);padding:11px 12px;}
  .text-input:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .check-btn{font-family:'Nunito',sans-serif;font-weight:800;font-size:.95rem;background:var(--gold);color:#221c15;border:none;border-radius:var(--radius);padding:11px 18px;cursor:pointer;}
  .check-btn:disabled{opacity:.6;cursor:default;}

  .el-keyboard{margin-top:10px;background:var(--card-2);border:1px solid rgba(217,164,65,0.2);border-radius:var(--radius);padding:8px;}
  .el-kb-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .el-kb-hint{font-size:.72rem;color:var(--ink-faint);}
  .el-kb-row{display:flex;gap:4px;margin-bottom:4px;justify-content:center;}
  .el-kb-key{
    font-family:'Georgia',serif;font-size:1.05rem;min-width:30px;flex:1;max-width:42px;
    background:var(--card);border:1px solid rgba(217,164,65,0.25);border-radius:5px;color:var(--ink);
    padding:8px 2px;cursor:pointer;
  }
  .el-kb-key:hover{border-color:var(--gold);}
  .el-kb-shift{max-width:none;flex:none;font-family:'Nunito',sans-serif;font-size:.75rem;padding:8px 12px;}
  .el-kb-shift.active{background:var(--gold);color:#221c15;border-color:var(--gold);font-weight:700;}
  .el-kb-wide{max-width:none;flex:0 0 50px;}
  .el-kb-space{max-width:none;flex:1;}

  .match-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  @media (max-width:420px){.match-grid{grid-template-columns:repeat(2,1fr);}}
  .match-tile{
    font-family:'Cinzel',serif;font-size:1.4rem;
    background:var(--card-2);border:1px solid rgba(217,164,65,0.3);color:var(--ink);
    border-radius:var(--radius);padding:16px 8px;cursor:pointer;transition:transform .1s,background .15s;
  }
  .match-tile:hover:not(:disabled){border-color:var(--gold);}
  .match-tile.selected{background:var(--gold-dim);border-color:var(--gold);}
  .match-tile.matched{background:var(--good);border-color:var(--good);color:#fff;opacity:.75;}
  .match-tile.wrong-flash{background:var(--bad);border-color:var(--bad);color:#fff;}
  .match-tile:disabled{cursor:default;}

  .alfabet-table th, .alfabet-table td{padding:5px 8px;}
  .alfabet-row{cursor:pointer;}
  .alfabet-row:hover td{background:rgba(217,164,65,0.08);}
  .alfabet-row.open td{background:rgba(217,164,65,0.12);}
  .alfabet-row td:last-child::after{content:' ▾';color:var(--ink-faint);font-size:.75rem;}
  .alfabet-row.open td:last-child::after{content:' ▴';color:var(--gold);}
  .alfabet-detail td{color:var(--ink-dim);font-size:.85rem;background:var(--card-2);border-bottom:1px solid rgba(217,164,65,0.15);}
  .quiz-meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--ink-faint);margin-bottom:12px;}
  .quiz-question{font-size:1.1rem;color:var(--ink);margin-bottom:4px;}
  .quiz-question .w{font-style:italic;color:var(--gold);}
  .quiz-question .w.hintable{cursor:pointer;border-bottom:1px dotted var(--gold);}
  .hint-text{font-family:'Nunito',sans-serif;letter-spacing:1px;color:var(--ink-faint);font-size:.9rem;min-height:1.2em;margin:2px 0 0;}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
  @media (max-width:480px){.options{grid-template-columns:1fr;}}
  .opt{font-family:'Nunito',sans-serif;font-size:.98rem;font-weight:700;background:var(--card-2);border:1px solid rgba(217,164,65,0.3);color:var(--ink);border-radius:var(--radius);padding:11px;cursor:pointer;}
  .opt.active{background:var(--gold);border-color:var(--gold);color:#221c15;}
  .ending{font-weight:800;color:var(--gold);text-decoration:underline;text-decoration-color:var(--gold-dim);text-underline-offset:2px;}
  .opt:hover:not(:disabled){border-color:var(--gold);}
  .opt.correct{background:var(--good);border-color:var(--good);color:#fff;}
  .opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff;}
  .opt:disabled{cursor:default;opacity:.85;}
  .feedback{margin-top:12px;min-height:1.4em;font-weight:700;}
  .feedback.good{color:var(--good);}
  .feedback.bad{color:var(--bad);}
  .next-btn{margin-top:14px;background:var(--gold);color:#221c15;border:none;border-radius:var(--radius);padding:10px 20px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;display:none;}
  .next-btn.show{display:inline-block;}

  .placeholder{text-align:center;padding:40px 20px;color:var(--ink-faint);}

  .start-screen{padding:20px 0 10px;}
  .start-intro{text-align:center;color:var(--ink-dim);font-size:1.05rem;margin-bottom:22px;}
  .start-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:480px){.start-grid{grid-template-columns:1fr;}}
  .start-btn{
    --sc: var(--gold);
    background:var(--card);border:1px solid var(--sc);border-radius:var(--radius);
    padding:26px 18px;text-align:center;cursor:pointer;color:var(--ink);font-family:'Nunito',sans-serif;
    transition:transform .12s, box-shadow .12s;
  }
  .start-btn:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.35);}
  .start-btn strong{display:block;font-family:'Cinzel',serif;font-size:1.3rem;color:var(--sc);margin-bottom:6px;}
  .start-btn span{color:var(--ink-faint);font-size:.85rem;}

  .chapter-block{margin-bottom:10px;}
  .chapter-header{
    width:100%;display:flex;justify-content:space-between;align-items:center;
    background:var(--card);border:1px solid rgba(217,164,65,0.25);border-radius:var(--radius);
    padding:12px 16px;cursor:pointer;color:var(--ink);font-family:'Cinzel',serif;font-size:1rem;text-align:left;
  }
  .chapter-header:hover{border-color:var(--gold);}
  .chapter-header.open{border-color:var(--gold);background:var(--card-2);}
  .chapter-arrow{color:var(--ink-faint);transition:transform .15s;}
  .chapter-header.open .chapter-arrow{transform:rotate(180deg);color:var(--gold);}
  .chapter-subs{display:flex;flex-direction:column;gap:6px;padding:10px 4px 4px 16px;}
  .sub-btn{
    background:var(--card-2);border:1px solid rgba(217,164,65,0.2);border-radius:var(--radius);
    padding:9px 14px;font-size:.85rem;color:var(--ink-dim);font-family:'Nunito',sans-serif;cursor:pointer;text-align:left;
  }
  .sub-btn:hover{border-color:var(--gold);color:var(--ink);}
  .sub-btn.active{background:var(--gold);border-color:var(--gold);color:#221c15;font-weight:700;}
  .sub-btn span{opacity:.7;font-size:.8em;}
  .back-btn{
    background:var(--card);border:1px solid rgba(217,164,65,0.3);border-radius:var(--radius);
    color:var(--gold);font-family:'Nunito',sans-serif;font-weight:700;font-size:.85rem;
    padding:8px 14px;cursor:pointer;margin-bottom:10px;
  }
  .back-btn:hover{border-color:var(--gold);}
  .chapter-header.select-mode{display:flex;align-items:center;gap:10px;}
  .chk-box{
    width:20px;height:20px;flex:none;border:2px solid var(--gold-dim);border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;color:transparent;
  }
  .chk-box.checked{background:var(--gold);border-color:var(--gold);color:#221c15;}
  .sub-row{display:flex;align-items:center;gap:10px;}
  .sub-row .sub-btn{flex:1;}
  .placeholder .big{font-family:'Cinzel',serif;color:var(--gold);font-size:1.1rem;margin-bottom:8px;}

  footer{text-align:center;color:var(--ink-faint);font-size:.8rem;margin-top:50px;}
  .version-badge{position:fixed;top:8px;right:10px;font-family:'Nunito',sans-serif;font-size:.72rem;color:var(--ink-faint);background:var(--card);border:1px solid rgba(217,164,65,0.2);border-radius:999px;padding:3px 9px;z-index:50;}
</style>
</head>
<body>
<div class="version-badge">v1.67</div>
<div class="wrap">
  <header>
    <button id="back-btn" class="back-btn" style="display:none;">← Terug</button>
  </header>
  <main id="content"></main>

  <footer>Gemaakt om samen talen onder de knie te krijgen — succes!</footer>
</div>

<script>
(function(){
"use strict";

/* ================= GENERIC HELPERS ================= */
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

/* ================= GRIEKS VIRTUEEL TOETSENBORD (moderne ΕΛ-indeling) ================= */
const EL_KB_ROWS = [
  ['ς','ε','ρ','τ','υ','θ','ι','ο','π'],
  ['α','σ','δ','φ','γ','η','ξ','κ','λ'],
  ['ζ','χ','ψ','ω','β','ν','μ']
];
const EL_KB_UPPER = {
  'ς':'Σ','ε':'Ε','ρ':'Ρ','τ':'Τ','υ':'Υ','θ':'Θ','ι':'Ι','ο':'Ο','π':'Π',
  'α':'Α','σ':'Σ','δ':'Δ','φ':'Φ','γ':'Γ','η':'Η','ξ':'Ξ','κ':'Κ','λ':'Λ',
  'ζ':'Ζ','χ':'Χ','ψ':'Ψ','ω':'Ω','β':'Β','ν':'Ν','μ':'Μ'
};
function elKeyboardHTML(){
  const rows = EL_KB_ROWS.map((row,ri)=>`
    <div class="el-kb-row">${row.map(ch=>`<button type="button" class="el-kb-key" data-ch="${ch}">${ch}</button>`).join('')}${ri===2?'<button type="button" class="el-kb-key el-kb-wide" data-action="backspace">⌫</button>':''}</div>`
  ).join('');
  return `<div class="el-keyboard" data-role="el-keyboard">
    <div class="el-kb-toolbar">
      <button type="button" class="el-kb-key el-kb-shift" data-action="shift">Hoofdletters</button>
      <span class="el-kb-hint">Grieks toetsenbord (ΕΛ-indeling)</span>
    </div>
    ${rows}
    <div class="el-kb-row"><button type="button" class="el-kb-key el-kb-space" data-action="space">spatie</button></div>
  </div>`;
}
function wireElKeyboard(slotEl, inputEl){
  if(!slotEl || !inputEl) return;
  slotEl.innerHTML = elKeyboardHTML();
  let shiftOn = false;
  const kb = slotEl.querySelector('[data-role="el-keyboard"]');
  const shiftBtn = kb.querySelector('.el-kb-shift');
  function refreshCase(){
    kb.querySelectorAll('.el-kb-key[data-ch]').forEach(btn=>{
      const lower = btn.dataset.ch;
      btn.textContent = shiftOn ? (EL_KB_UPPER[lower] || lower) : lower;
    });
    shiftBtn.classList.toggle('active', shiftOn);
  }
  kb.addEventListener('click', (e)=>{
    const btn = e.target.closest('.el-kb-key');
    if(!btn) return;
    if(btn.dataset.action === 'shift'){ shiftOn = !shiftOn; refreshCase(); return; }
    if(btn.dataset.action === 'backspace'){ inputEl.value = inputEl.value.slice(0,-1); inputEl.focus(); return; }
    if(btn.dataset.action === 'space'){ inputEl.value += ' '; inputEl.focus(); return; }
    const lower = btn.dataset.ch;
    inputEl.value += shiftOn ? (EL_KB_UPPER[lower] || lower) : lower;
    inputEl.focus();
  });
}

function tableHTML(colHeaders, rowHeaders, cellFn, caption){
  let html = '<div class="table-scroll"><table>';
  if(caption) html += `<caption>${caption}</caption>`;
  html += `<thead><tr><th></th>${colHeaders.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`;
  rowHeaders.forEach((rh,ri)=>{
    html += `<tr style="--case-color:${rh.color||'var(--gold)'};"><th>${rh.label}</th>`;
    colHeaders.forEach((c,ci)=>{ html += `<td>${cellFn(ri,ci)}</td>`; });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}
// Splitst een volledige vorm in een stam (plain) + uitgang (dikgedrukt/gekleurd/onderstreept).
// 'form' moet beginnen met 'stem'; is dat niet zo, dan wordt de hele vorm getoond zonder opsplitsing.
function hl(stem, form){
  if(!form.startsWith(stem)) return form;
  const ending = form.slice(stem.length);
  return ending ? `${stem}<span class="ending">${ending}</span>` : stem;
}

/* ================= LATIN: NOUN ENGINE ================= */
function decl1(stem){ return { nomSg:stem+'a',genSg:stem+'ae',datSg:stem+'ae',accSg:stem+'am',ablSg:stem+'a',
  nomPl:stem+'ae',genPl:stem+'arum',datPl:stem+'is',accPl:stem+'as',ablPl:stem+'is' }; }
function decl2m(stem){ return { nomSg:stem+'us',genSg:stem+'i',datSg:stem+'o',accSg:stem+'um',ablSg:stem+'o',
  nomPl:stem+'i',genPl:stem+'orum',datPl:stem+'is',accPl:stem+'os',ablPl:stem+'is' }; }
function decl2n(stem){ return { nomSg:stem+'um',genSg:stem+'i',datSg:stem+'o',accSg:stem+'um',ablSg:stem+'o',
  nomPl:stem+'a',genPl:stem+'orum',datPl:stem+'is',accPl:stem+'a',ablPl:stem+'is' }; }
function decl3(nomSg,stem){ return { nomSg:nomSg,genSg:stem+'is',datSg:stem+'i',accSg:stem+'em',ablSg:stem+'e',
  nomPl:stem+'es',genPl:stem+'um',datPl:stem+'ibus',accPl:stem+'es',ablPl:stem+'ibus' }; }

  nomPl:stem+'a',genPl:stem+'um',datPl:stem+'ibus',accPl:stem+'a',ablPl:stem+'ibus' }; }

/* Small curated word set for "taal -> NL" phrase questions (short two-word combos / mini sentences) */
const STANDAARD_LA = [
  {lat:'vir', stem:'vir', type:'decl2m', nomOverride:'vir', nl:'de man', nlPl:'de mannen'},
  {lat:'gladius', stem:'gladi', type:'decl2m', nl:'het zwaard', nlPl:'de zwaarden'},
  {lat:'femina', stem:'femin', type:'decl1', nl:'de vrouw', nlPl:'de vrouwen'},
  {lat:'servus', stem:'serv', type:'decl2m', nl:'de slaaf', nlPl:'de slaven'},
  {lat:'rex', stem:'reg', type:'decl3', nl:'de koning', nlPl:'de koningen'},
  {lat:'puella', stem:'puell', type:'decl1', nl:'het meisje', nlPl:'de meisjes'}
];
function laStandaardForms(w){
  if(w.type==='decl1') return decl1(w.stem);
  if(w.type==='decl3') return decl3(w.lat, w.stem);
  const f = decl2m(w.stem);
  if(w.nomOverride) f.nomSg = w.nomOverride;
  return f;
}
function laPickStandaard(exclude){
  let w;
  do{ w = STANDAARD_LA[Math.floor(Math.random()*STANDAARD_LA.length)]; } while(exclude && w===exclude);
  return w;
}
function laPhraseQuestion(){
  const caseKey = ['nom','gen','dat','acc','abl'][Math.floor(Math.random()*5)];
  if(caseKey==='gen'){
    const w1=laPickStandaard(), w2=laPickStandaard(w1);
    const f1=laStandaardForms(w1), f2=laStandaardForms(w2);
    const phrase = `${f1.nomSg} ${f2.genSg}`;
    const correct = `${w1.nl} van ${w2.nl}`;
    const d0 = `${w2.nl} van ${w1.nl}`, d1 = `${w1.nl} aan/voor ${w2.nl}`, d2 = `${w1.nl} door/met/in ${w2.nl}`;
    const altLookup = {};
    altLookup[normAnswer(d0)] = `dat zou "${f2.nomSg} ${f1.genSg}" betekenen (bezit omgekeerd)`;
    altLookup[normAnswer(d1)] = `dat is de datief-lezing van "${f2.datSg}", niet de genitief van "${f2.genSg}"`;
    altLookup[normAnswer(d2)] = `dat is de ablatief-lezing van "${f2.ablSg}", niet de genitief van "${f2.genSg}"`;
    return { questionHTML:`Wat betekent <span class="w">${phrase}</span>?`, correct, mcOptions:shuffle([correct,d0,d1,d2]), accept:(v)=>({ok: normAnswer(v)===normAnswer(correct), typo:false}), altLookup };
  }
  if(caseKey==='acc'){
    const w1=laPickStandaard(), w2=laPickStandaard(w1);
    const f1=laStandaardForms(w1), f2=laStandaardForms(w2);
    const phrase = `${f1.nomSg} ${f2.accSg} videt.`;
    const correct = `${w1.nl} ziet ${w2.nl}.`;
    const d0 = `${w2.nl} ziet ${w1.nl}.`, d1 = `${w1.nl} is ${w2.nl}.`, d2 = `${w2.nl} is ${w1.nl}.`;
    const altLookup = {};
    altLookup[normAnswer(d0)] = `dat zou "${f2.nomSg} ${f1.accSg} videt." betekenen (onderwerp en lijdend voorwerp omgekeerd)`;
    altLookup[normAnswer(d1)] = `"videt" betekent "ziet", niet "is"`;
    altLookup[normAnswer(d2)] = `"videt" betekent "ziet", niet "is", en het onderwerp/voorwerp staan omgekeerd`;
    return { questionHTML:`Wat betekent <span class="w">${phrase}</span>?`, correct, mcOptions:shuffle([correct,d0,d1,d2]), accept:(v)=>({ok: normAnswer(v)===normAnswer(correct), typo:false}), altLookup };
  }
  const w1 = laPickStandaard();
  const f1 = laStandaardForms(w1);
  const number = Math.random()<0.5 ? 'Sg' : 'Pl';
  const nl = number==='Sg' ? w1.nl : w1.nlPl;
  const formKey = caseKey + number;
  const latWord = f1[formKey];
  const templateFns = { nom:(x)=>x, dat:(x)=>'aan/voor '+x, abl:(x)=>'door/met/in '+x };
  const correct = templateFns[caseKey](nl);
  const otherKeys = ['nom','dat','abl'].filter(k=>k!==caseKey);
  const w2 = laPickStandaard(w1);
  const nl2 = number==='Sg' ? w2.nl : w2.nlPl;
  const distractors = [templateFns[otherKeys[0]](nl), templateFns[otherKeys[1]](nl), templateFns[caseKey](nl2)];
  const altLookup = {};
  altLookup[normAnswer(distractors[0])] = `dat is de ${CASE_LABEL[otherKeys[0]]}-lezing, niet de ${CASE_LABEL[caseKey]}`;
  altLookup[normAnswer(distractors[1])] = `dat is de ${CASE_LABEL[otherKeys[1]]}-lezing, niet de ${CASE_LABEL[caseKey]}`;
  altLookup[normAnswer(distractors[2])] = `dat is de betekenis van "${w2.lat}" (een ander woord), niet van "${latWord}"`;

  return { questionHTML:`Wat betekent <span class="w">${latWord}</span>?`, correct, mcOptions:shuffle([correct,...distractors]), accept:(v)=>({ok: normAnswer(v)===normAnswer(correct), typo:false}), altLookup };
}

function conj2(stem){ return {
  pres:[stem+'eo',stem+'es',stem+'et',stem+'emus',stem+'etis',stem+'ent'],
  impf:[stem+'ebam',stem+'ebas',stem+'ebat',stem+'ebamus',stem+'ebatis',stem+'ebant'],
  fut:[stem+'ebo',stem+'ebis',stem+'ebit',stem+'ebimus',stem+'ebitis',stem+'ebunt'] }; }
function conj3(stem){ return {
  pres:[stem+'o',stem+'is',stem+'it',stem+'imus',stem+'itis',stem+'unt'],
  impf:[stem+'ebam',stem+'ebas',stem+'ebat',stem+'ebamus',stem+'ebatis',stem+'ebant'],
  fut:[stem+'am',stem+'es',stem+'et',stem+'emus',stem+'etis',stem+'ent'] }; }
function conj4(stem){ return {
  pres:[stem+'io',stem+'is',stem+'it',stem+'imus',stem+'itis',stem+'iunt'],
  impf:[stem+'iebam',stem+'iebas',stem+'iebat',stem+'iebamus',stem+'iebatis',stem+'iebant'],

function verbFormsLA(word, engineFn){
  const c = engineFn(word.stem);
  const out = {};
  ['pres','impf','fut'].forEach(t=>{ c[t].forEach((f,i)=>{ out[t+i] = f; }); });
  return out;
}

/* ================= GERMAN: NOUN (ARTICLE) ENGINE ================= */
function deArtForms(gender){
  const M={nomSg:'der',genSg:'des',datSg:'dem',accSg:'den'};
  const F={nomSg:'die',genSg:'der',datSg:'der',accSg:'die'};
  const N={nomSg:'das',genSg:'des',datSg:'dem',accSg:'das'};
  const PL={nomPl:'die',genPl:'der',datPl:'den',accPl:'die'};
  const sg = gender==='m'?M:gender==='f'?F:N;
  return Object.assign({}, sg, PL);
}

/* Small curated word set for "taal -> NL" phrase questions */
const STANDAARD_DE = [
  {de:'Mann', g:'m', nl:'de man', genSuffix:'es'},
  {de:'Schwert', g:'n', nl:'het zwaard', genSuffix:'es'},
  {de:'Frau', g:'f', nl:'de vrouw', genSuffix:''},
  {de:'König', g:'m', nl:'de koning', genSuffix:'s'},
  {de:'Kind', g:'n', nl:'het kind', genSuffix:'es'}
];
function dePickStandaard(exclude){
  let w;
  do{ w = STANDAARD_DE[Math.floor(Math.random()*STANDAARD_DE.length)]; } while(exclude && w===exclude);
  return w;
}
function dePhraseFor(w, caseKey){
  const art = deArtForms(w.g)[caseKey+'Sg'];
  const noun = caseKey==='gen' ? w.de + w.genSuffix : w.de;
  return `${art} ${noun}`;
}
function dePhraseQuestion(){
  const caseKey = ['nom','gen','dat','acc'][Math.floor(Math.random()*4)];
  if(caseKey==='gen'){
    const w1=dePickStandaard(), w2=dePickStandaard(w1);
    const phrase = `${dePhraseFor(w1,'nom')} ${dePhraseFor(w2,'gen')}`;
    const correct = `${w1.nl} van ${w2.nl}`;
    const d0 = `${w2.nl} van ${w1.nl}`, d1 = `${w1.nl} aan/voor ${w2.nl}`, d2 = `${w1.nl} en ${w2.nl}`;
    const altLookup = {};
    altLookup[normAnswer(d0)] = `dat zou "${dePhraseFor(w2,'nom')} ${dePhraseFor(w1,'gen')}" betekenen (bezit omgekeerd)`;
    altLookup[normAnswer(d1)] = `dat is de datief-lezing van "${dePhraseFor(w2,'dat')}", niet de genitief van "${dePhraseFor(w2,'gen')}"`;
    altLookup[normAnswer(d2)] = `er staat geen "en" of los rijtje, maar een bezitsrelatie ("van")`;
    return { questionHTML:`Wat betekent <span class="w">${phrase}</span>?`, correct, mcOptions:shuffle([correct,d0,d1,d2]), accept:(v)=>({ok: normAnswer(v)===normAnswer(correct), typo:false}), altLookup };
  }
  if(caseKey==='acc'){
    const w1=dePickStandaard(), w2=dePickStandaard(w1);
    const phrase = `${dePhraseFor(w1,'nom')} sieht ${dePhraseFor(w2,'acc')}.`;
    const correct = `${w1.nl} ziet ${w2.nl}.`;
    const d0 = `${w2.nl} ziet ${w1.nl}.`, d1 = `${w1.nl} is ${w2.nl}.`, d2 = `${w2.nl} is ${w1.nl}.`;
    const altLookup = {};
    altLookup[normAnswer(d0)] = `dat zou "${dePhraseFor(w2,'nom')} sieht ${dePhraseFor(w1,'acc')}." betekenen (onderwerp en lijdend voorwerp omgekeerd)`;
    altLookup[normAnswer(d1)] = `"sieht" betekent "ziet", niet "is"`;
    altLookup[normAnswer(d2)] = `"sieht" betekent "ziet", niet "is", en onderwerp/voorwerp staan omgekeerd`;
    return { questionHTML:`Wat betekent <span class="w">${phrase}</span>?`, correct, mcOptions:shuffle([correct,d0,d1,d2]), accept:(v)=>({ok: normAnswer(v)===normAnswer(correct), typo:false}), altLookup };
  }
  const w1 = dePickStandaard();
  const phrase = dePhraseFor(w1, caseKey);
  const templateFns = { nom:(x)=>x, dat:(x)=>'aan/voor '+x };
  const otherKey = caseKey==='nom' ? 'dat' : 'nom';
  const correct = templateFns[caseKey](w1.nl);
  const w2 = dePickStandaard(w1);
  const distractors = [templateFns[otherKey](w1.nl), templateFns[caseKey](w2.nl), templateFns[otherKey](w2.nl)];
  const altLookup = {};
  altLookup[normAnswer(distractors[0])] = `dat is de ${DE_CASE_LABEL[otherKey]}-lezing, niet de ${DE_CASE_LABEL[caseKey]}`;
  altLookup[normAnswer(distractors[1])] = `dat is de betekenis van "${dePhraseFor(w2,caseKey)}" (een ander woord), niet van "${phrase}"`;
  altLookup[normAnswer(distractors[2])] = `dat is zowel een ander woord als de verkeerde naamval`;
  return { questionHTML:`Wat betekent <span class="w">${phrase}</span>?`, correct, mcOptions:shuffle([correct,...distractors]), accept:(v)=>({ok: normAnswer(v)===normAnswer(correct), typo:false}), altLookup };
}

/* ================= GERMAN: VERB ENGINE ================= */
function dePresentForms(stem, needsE){
  return needsE
    ? [stem+'e',stem+'est',stem+'et',stem+'en',stem+'et',stem+'en']
    : [stem+'e',stem+'st',stem+'t',stem+'en',stem+'t',stem+'en'];
}
const DE_HABEN = ['habe','hast','hat','haben','habt','haben'];
function dePerfektForms(stem, needsE){
  const participle = 'ge'+stem+(needsE?'et':'t');
  return DE_HABEN.map(h=>h+' '+participle);
}

// Build a lowercase-Greek-char -> Latin-letter map from EL_ALFABET, then strip
// accents/breathing marks (Unicode combining marks) before mapping each
// character — same approach as the original standalone alfabet app.
const EL_CHAR_MAP = {};
EL_ALFABET.forEach(l=>{
  EL_CHAR_MAP[l.lower] = l.translit;
  if(l.lower.includes('/')){
    l.lower.split('/').map(s=>s.trim()).forEach(f=>{ EL_CHAR_MAP[f]=l.translit; });
  }
});
EL_CHAR_MAP['σ'] = 's';
EL_CHAR_MAP['ς'] = 's';
function elTransliterate(word){
  const stripped = word.normalize('NFD').replace(/[\u0300-\u036f\u0313\u0314\u0342\u0345]/g,'');
  let out = '';
  for(const ch of stripped){ out += EL_CHAR_MAP[ch] ?? ch; }
  return out;
}

function initLaParseSelect(wrapId){
  const root = document.getElementById(wrapId);
  if(!root) return;
  const selected = new Set(LA_DECL_GROUPS.map((g,gi)=>gi)); // alles standaard aan
  let direction = 'both';
  let wordset = 'basis';
  const footer = root.querySelector('[data-role="laparse-footer"]');
  const quizArea = root.querySelector('[data-role="laparse-quiz"]');

  root.querySelectorAll('[data-role="chk-group"]').forEach(chk=>{
    chk.classList.add('checked');
    chk.addEventListener('click', ()=>{
      const gi = +chk.dataset.gi;
      if(selected.has(gi)){ selected.delete(gi); chk.classList.remove('checked'); }
      else { selected.add(gi); chk.classList.add('checked'); }
      updateFooter();
    });
  });
  root.querySelectorAll('[data-wordset]').forEach(b=>{
    b.addEventListener('click', ()=>{
      wordset = b.dataset.wordset;
      root.querySelectorAll('[data-wordset]').forEach(x=>x.classList.toggle('active', x===b));
      LA_DECL_GROUPS.forEach((g,gi)=>{
        const countEl = root.querySelector(`[data-role="grp-count-${gi}"]`);
        if(countEl) countEl.textContent = `(${laDeclWords(g.id,wordset).length} woorden)`;
      });
    });
  });
  root.querySelectorAll('[data-dir]').forEach(b=>{
    b.addEventListener('click', ()=>{
      direction = b.dataset.dir;
      root.querySelectorAll('[data-dir]').forEach(x=>x.classList.toggle('active', x===b));
    });
  });

  function updateFooter(){
    footer.innerHTML = selected.size ? `<button class="next-btn show" data-role="laparse-start">Start oefening</button>` : '<p style="color:var(--bad);font-size:.85rem;">Kies minstens één verbuigingsgroep.</p>';
    const startBtn = footer.querySelector('[data-role="laparse-start"]');
    if(startBtn){
      startBtn.addEventListener('click', ()=>{
        const groups = Array.from(selected).map(gi=>({ ...LA_DECL_GROUPS[gi], words: laDeclWords(LA_DECL_GROUPS[gi].id, wordset) }));
        quizArea.innerHTML = renderLaParseQuiz(groups, direction);
      });
    }
  }
  updateFooter();
}

function renderLaParseQuiz(groups, direction){
  const wrapId = 'laparseq-' + Math.random().toString(36).slice(2,8);
  setTimeout(()=>initLaParseQuiz(wrapId, groups, direction), 0);
  return `<div id="${wrapId}">
    <div class="quiz-card">
      <div class="quiz-meta"><span data-role="lp-score">Score: 0 / 0</span></div>
      <div data-role="lp-body"></div>
      <p class="feedback" data-role="lp-feedback"></p>
      <button class="next-btn" data-role="lp-next">Volgende →</button>
    </div>
  </div>`;
}

function initLaParseQuiz(wrapId, groups, direction){
  const root = document.getElementById(wrapId);
  if(!root) return;
  const scoreEl = root.querySelector('[data-role="lp-score"]');
  const bodyEl = root.querySelector('[data-role="lp-body"]');
  const feedbackEl = root.querySelector('[data-role="lp-feedback"]');
  const nextBtn = root.querySelector('[data-role="lp-next"]');
  let score=0, total=0, current=null;

  const allWords = groups.flatMap(g=>g.words.map(w=>({w, g})));

  function pickMode(){
    if(direction==='identify') return 'identify';
    if(direction==='produce') return 'produce';
    return Math.random()<0.5 ? 'identify' : 'produce';
  }

  function next(){
    feedbackEl.textContent=''; feedbackEl.className='feedback';
    nextBtn.classList.remove('show');
    const mode = pickMode();
    const { w, g } = allWords[Math.floor(Math.random()*allWords.length)];
    const forms = g.forms(w);
    const key = LA_CASE_NUM_KEYS[Math.floor(Math.random()*LA_CASE_NUM_KEYS.length)];
    const formStr = forms[key];
    // alle (naamval,aantal) van dít woord die exact dezelfde vorm opleveren
    const matches = LA_CASE_NUM_KEYS.filter(k=>forms[k]===formStr);
    current = { mode, w, g, forms, key, formStr, matches };

    if(mode==='identify') renderIdentify();
    else renderProduce();
    scoreEl.textContent = `Score: ${score} / ${total}`;
  }

  function wireWordHint(){
    const el = bodyEl.querySelector('[data-role="lp-word-hint"]');
    if(!el) return;
    el.addEventListener('click', ()=>{
      bodyEl.querySelector('[data-role="lp-hint"]').textContent = `Hint (woordenboekvorm): ${current.w.lat}, ${current.forms.genSg}`;
    });
  }

  function renderIdentify(){
    const grid = ['nom','gen','dat','acc','abl'].map(caseKey=>`
      <div style="margin-bottom:8px;">
        <div style="color:var(--ink-dim);font-size:.85rem;margin-bottom:4px;">${CASE_LABEL[caseKey]}</div>
        <div style="display:flex;gap:6px;">
          <button type="button" class="opt lp-toggle" data-role="lp-cn" data-key="${caseKey}Sg" style="flex:1;">enkelvoud</button>
          <button type="button" class="opt lp-toggle" data-role="lp-cn" data-key="${caseKey}Pl" style="flex:1;">meervoud</button>
        </div>
      </div>`).join('');
    bodyEl.innerHTML = `
      <p class="quiz-question" style="text-align:center;font-size:1.4rem;"><span class="w" data-role="lp-word-hint" style="cursor:pointer;border-bottom:1px dotted var(--gold);" title="Tik voor hint">${current.formStr}</span></p>
      <p class="hint-text" data-role="lp-hint"></p>
      <div style="margin:10px 0;">${grid}</div>
      <div>
        <div style="color:var(--ink-dim);font-size:.85rem;margin-bottom:4px;">Geslacht</div>
        <div style="display:flex;gap:6px;">
          <button type="button" class="opt lp-gender" data-role="lp-g" data-g="m" style="flex:1;">mannelijk</button>
          <button type="button" class="opt lp-gender" data-role="lp-g" data-g="f" style="flex:1;">vrouwelijk</button>
          <button type="button" class="opt lp-gender" data-role="lp-g" data-g="n" style="flex:1;">onzijdig</button>
        </div>
      </div>
      <button class="next-btn show" data-role="lp-check" style="margin-top:12px;">Controleer</button>
    `;
    bodyEl.querySelector('[data-role="lp-check"]').addEventListener('click', checkIdentify);
    wireWordHint();
  }

  function checkIdentify(){
    const chosenKeys = Array.from(bodyEl.querySelectorAll('[data-role="lp-cn"].active')).map(b=>b.dataset.key);
    const chosenGender = bodyEl.querySelector('[data-role="lp-g"].active');
    const chosenG = chosenGender ? chosenGender.dataset.g : null;
    const correctSet = new Set(current.matches);
    const chosenSet = new Set(chosenKeys);
    const cnOk = correctSet.size===chosenSet.size && [...correctSet].every(k=>chosenSet.has(k));
    const gOk = chosenG === current.w.g;
    const isCorrect = cnOk && gOk;
    total++; if(isCorrect) score++;
    bodyEl.querySelectorAll('[data-role="lp-cn"]').forEach(b=>{
      b.disabled = true;
      if(correctSet.has(b.dataset.key)) b.classList.add('correct');
      else if(b.classList.contains('active')) b.classList.add('wrong');
    });
    bodyEl.querySelectorAll('[data-role="lp-g"]').forEach(b=>{
      b.disabled = true;
      if(b.dataset.g===current.w.g) b.classList.add('correct');
      else if(b.classList.contains('active')) b.classList.add('wrong');
    });
    const correctLabels = current.matches.map(k=>`${CASE_LABEL[k.slice(0,3)]} ${NUM_LABEL[k.slice(3)]}`).join(', ');
    feedbackEl.textContent = isCorrect ? `Goed zo! (${current.w.lat} — ${GENDER_LABEL[current.w.g]})` : `Niet helemaal — juist was: ${correctLabels}, ${GENDER_LABEL[current.w.g]} (${current.w.lat}, ${current.w.nl}).`;
    feedbackEl.className = 'feedback ' + (isCorrect?'good':'bad');
    scoreEl.textContent = `Score: ${score} / ${total}`;
    nextBtn.classList.add('show');
  }

  function renderProduce(){
    const caseKey = current.key.slice(0,3); const number = current.key.slice(3);
    bodyEl.innerHTML = `
      <p class="quiz-question">Wat is de <strong>${CASE_LABEL[caseKey]} ${NUM_LABEL[number]}</strong> (${GENDER_LABEL[current.w.g]}) van <span class="w" data-role="lp-word-hint" style="cursor:pointer;border-bottom:1px dotted var(--gold);" title="Tik voor hint">${current.w.lat}</span> (${current.w.nl})?</p>
      <p class="hint-text" data-role="lp-hint"></p>
      <div class="input-row" style="display:flex;">
        <input type="text" class="text-input" data-role="lp-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Typ je antwoord...">
        <button class="check-btn" data-role="lp-checkbtn">Controleer</button>
      </div>
    `;
    const input = bodyEl.querySelector('[data-role="lp-input"]');
    bodyEl.querySelector('[data-role="lp-checkbtn"]').addEventListener('click', ()=>checkProduce(input.value));
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') checkProduce(input.value); });
    wireWordHint();
  }

  function checkProduce(val){
    const isCorrect = normAnswer(val) === normAnswer(current.formStr);
    total++; if(isCorrect) score++;
    const input = bodyEl.querySelector('[data-role="lp-input"]');
    const checkBtn = bodyEl.querySelector('[data-role="lp-checkbtn"]');
    if(input){ input.disabled = true; }
    if(checkBtn){ checkBtn.disabled = true; }
    feedbackEl.textContent = isCorrect ? 'Goed zo!' : `Niet helemaal — het juiste antwoord was "${current.formStr}".`;
    feedbackEl.className = 'feedback ' + (isCorrect?'good':'bad');
    scoreEl.textContent = `Score: ${score} / ${total}`;
    nextBtn.classList.add('show');
  }

  root.addEventListener('click', (e)=>{
    const t = e.target;
    if(t.dataset && t.dataset.role==='lp-cn' && !t.disabled) t.classList.toggle('active');
    if(t.dataset && t.dataset.role==='lp-g' && !t.disabled){
      root.querySelectorAll('[data-role="lp-g"]').forEach(b=>b.classList.remove('active'));
      t.classList.add('active');
    }
  });

  nextBtn.addEventListener('click', next);
  next();
}

function laNounOefenen(){

    decl2: { title:'2e verbuigingsgroep', sub:'servus / donum', words: LA_DECL2, forms:(w)=>{ const s=w.lat.slice(0,-2); return w.g==='m'?decl2m(s):decl2n(s); }, vertaalFn: laPhraseQuestion },
    decl3: { title:'3e verbuigingsgroep', sub:'rex / nomen', words: LA_DECL3, forms:(w)=> w.g==='n' ? decl3n(w.lat,w.stem) : decl3(w.lat,w.stem), vertaalFn: laPhraseQuestion },
    adj: { title:'Bijvoeglijke naamwoorden', sub:'-us, -a, -um', words: LA_ADJ, forms:(w)=>{
      const stem=w.lat.slice(0,-2); const g=['m','f','n'][Math.floor(Math.random()*3)];
      const f = g==='m'?decl2m(stem):g==='f'?decl1(stem):decl2n(stem); f.gender=g; return f;
    } }

  return renderOefenCategoryPicker(cats, (word, formKey, forms)=>{
    const caseKey = formKey.slice(0,3); const number = formKey.slice(3);
    const genderNote = forms.gender ? ` — <em>${GENDER_LABEL[forms.gender]}</em>` : '';

  }, (w)=>w.lat, (word, formKey)=>{
    const caseKey = formKey.slice(0,3); const number = formKey.slice(3);
    return `${CASE_LABEL[caseKey]} ${NUM_LABEL[number]}`;
  }, undefined, undefined, 'LA');
}

/* ================= CONTENT: GERMAN NOUNS ================= */
function deNounLeren(){
  return `
  <h2>Naamvallen in het Duits</h2>
  <p>Het Duits kent vier naamvallen: Nominativ, Genitiv, Dativ en Akkusativ (geen ablatief). Het grote verschil met het Latijn: de naamval is bij de meeste woorden niet te zien aan het zelfstandig naamwoord zelf, maar aan het <strong>lidwoord</strong> ervoor.</p>
  <table><thead><tr><th>naamval</th><th>functie</th></tr></thead><tbody>
  <tr style="--case-color:var(--nom);"><th>Nominativ</th><td>onderwerp</td></tr>
  <tr style="--case-color:var(--gen);"><th>Genitiv</th><td>bezit ('van')</td></tr>

  </tbody></table>
  <div class="note">Nederlandse lesmethodes nummeren de naamvallen vaak: <strong>1e naamval</strong> = Nominativ, <strong>2e naamval</strong> = Genitiv, <strong>3e naamval</strong> = Dativ, <strong>4e naamval</strong> = Akkusativ. Je herkent ze ook door te vragen: <em>wie/wat</em> + persoonsvorm → 1e naamval (onderwerp); <em>wat</em> + persoonsvorm + onderwerp → 4e naamval (lijdend voorwerp).</div>

  </div>
  <div class="note">Wel verschuift de <strong>nadruk</strong>: het woord dat vooraan staat, krijgt de meeste klemtoon. <em>"Den Hund sieht der Mann"</em> benadrukt <em>den Hund</em> net iets sterker dan de neutrale volgorde <em>"Der Mann sieht den Hund"</em> — vergelijkbaar met hoe "De hónd ziet de man" in het Nederlands net iets anders klinkt.</div>
  <h3>Alle naamvallen in één zin</h3>
  <div class="card">
    <p style="margin-bottom:8px;font-style:italic;font-size:1.05rem;">
      <span style="color:var(--nom);">Der Sohn</span>
      <span style="color:var(--gen);">des Lehrers</span>
      gibt
      <span style="color:var(--dat);">der Mutter</span>
      <span style="color:var(--acc);">das Buch</span>.
    </p>
    <p style="margin-bottom:12px;color:var(--ink);">De zoon van de leraar geeft de moeder het boek.</p>
    <p style="margin:0;color:var(--ink-dim);font-size:.88rem;line-height:1.9;">
      <span style="color:var(--nom);font-weight:700;">Der Sohn</span> — Nominativ, het onderwerp ("de zoon")<br>
      <span style="color:var(--gen);font-weight:700;">des Lehrers</span> — Genitiv, bezit ("van de leraar")<br>
      <span style="color:var(--dat);font-weight:700;">der Mutter</span> — Dativ, meewerkend voorwerp ("aan de moeder")<br>
      <span style="color:var(--acc);font-weight:700;">das Buch</span> — Akkusativ, lijdend voorwerp ("het boek")
    </p>
  </div>

  <h3>De der-Gruppe en de ein-Gruppe</h3>
  <p>Duitse bijwoorden vóór het zelfstandig naamwoord vallen in twee groepen die allebei op dezelfde manier verbuigen als hun "kopwoord":</p>
  <ul style="color:var(--ink-dim);">
    <li><strong>der-Gruppe</strong> — verbuigt als <em>der/die/das/die</em>: ook <em>dieser</em> (deze/dit), <em>welcher</em> (welke), <em>jeder</em> (elke, alleen enkelvoud) en <em>alle</em> (alle, alleen meervoud);</li>

  </ul>
  <h3>Bepaald lidwoord (der/die/das) — der-Gruppe</h3>
  ${tableHTML(['mannelijk (der)','vrouwelijk (die)'],[

  <div class="note">Het zelfstandig naamwoord zelf verandert bijna nooit — alleen de genitief enkelvoud (mannelijk/onzijdig) krijgt vaak een extra <em>-s</em> of <em>-es</em> (<em>der Mann → des Mannes</em>), en de datief meervoud een <em>-n</em> (<em>den Männern</em>). Deze cursus oefent vooral het lidwoord, de belangrijkste naamval-marker.</div>
  <h3>Onbepaald lidwoord (ein/eine) — ein-Gruppe</h3>

  <h2>Het bezittelijk voornaamwoord</h2>

  <tr><td>sie</td><td>ihr(e)</td><td>hun</td></tr>
  <tr><td>Sie</td><td>Ihr(e)</td><td>uw</td></tr>

  <p>Een bezittelijk voornaamwoord verbuigt precies als <em>ein</em> (het hoort dus bij de ein-Gruppe): <em>ein Vater / mein Vater</em>, <em>eine Mutter / meine Mutter</em>, <em>ein Kind / mein Kind</em>, <em>keine Kinder / meine Kinder</em>.</p>

  <h2>Het geslacht van het zelfstandig naamwoord</h2>
  <p>Elk Duits zelfstandig naamwoord heeft een vast geslacht: <strong>der</strong> (mannelijk), <strong>die</strong> (vrouwelijk) of <strong>das</strong> (onzijdig). In woordenboeken zie je dat vaak afgekort als m / v (of w) / o (of s). Het meervoud krijgt altijd <em>die</em>.</p>

  <ul style="color:var(--ink-dim);">
    <li><strong>Mannelijk</strong> zijn vaak: mannelijke personen en dieren, beroepen, dagen, maanden, dagdelen en jaargetijden — bijv. <em>der Nachbar</em>, <em>der Montag</em>.</li>
    <li><strong>Vrouwelijk</strong> zijn vaak: vrouwelijke personen/dieren/beroepen en woorden op <em>-heit, -keit, -ung, -schaft</em>, en de meeste woorden op <em>-e</em> — bijv. <em>die Nachbarin</em>, <em>die Wand</em>.</li>
    <li><strong>Onzijdig</strong> zijn vaak: woorden die in het Nederlands ook het-woorden zijn, en verkleinwoorden op <em>-chen</em> — bijv. <em>das Wohnviertel</em>, <em>das Mädchen</em>.</li>

  <p>Veel mannelijke beroepen/personen maak je vrouwelijk met <em>-in</em>: <em>der Nachbar → die Nachbarin</em>.</p>
  <div class="note">Leer een zelfstandig naamwoord altijd mét het lidwoord erbij: niet alleen <em>Schreibtisch</em>, maar <em>der Schreibtisch</em> — aan het lidwoord zie je het geslacht.</div>

function deNounOefenen(){

function deVerbOefenen(){
  const cats = {
    verbs: { title:'Regelmatige werkwoorden', sub:'Präsens & Perfekt', words: DE_VERBS, forms:(w)=>{
      const out={}; dePresentForms(w.stem,w.needsE).forEach((f,i)=>out['pres'+i]=f);
      dePerfektForms(w.stem,w.needsE).forEach((f,i)=>out['perf'+i]=f);
      return out;
    } },
    strong: { title:'Sterke werkwoorden', sub:'a → ä, Präsens', words: DE_STRONG_A, forms:(w)=>{
      const out={}; deAaForms(w.stem,w.aStem,w.needsE).forEach((f,i)=>out['pres'+i]=f);
      return out;
    } },
    modal: { title:'Modale werkwoorden', sub:'+ möchten & wissen', words: DE_MODALS, forms:(w)=>{
      const out={}; w.forms.forEach((f,i)=>out['pres'+i]=f);
      return out;
    } }
  };
  return renderOefenCategoryPicker(cats, (word, formKey)=>{
    const tense = formKey.slice(0,4); const person = +formKey.slice(4);
    const tenseLabel = tense==='pres' ? 'Präsens' : 'Perfekt';
    return `Wat is de vorm van <span class="w">${word.de}</span> (${word.nl}) in het <strong>${tenseLabel}</strong> voor <strong>${PERSON_LABEL_DE[person]}</strong>?`;
  }, (w)=>w.de, (word, formKey)=>{
    const tense = formKey.slice(0,4); const person = +formKey.slice(4);
    const tenseLabel = tense==='pres' ? 'Präsens' : 'Perfekt';
    return `${tenseLabel} voor ${PERSON_LABEL_DE[person]}`;
  }, undefined, undefined, 'DE');
}

    <strong>Hoe kom je aan de stam?</strong> Bij regelmatige werkwoorden haal je de infinitiefuitgang (<em>-er</em>, <em>-ir</em> of <em>-re</em>) van de infinitief af — wat overblijft is de stam. Bijv. <em>parl<span class="ending">er</span></em> → stam <em>parl-</em>; <em>fin<span class="ending">ir</span></em> → stam <em>fin-</em>; <em>vend<span class="ending">re</span></em> → stam <em>vend-</em>. Aan die stam plak je vervolgens de <span class="ending">uitgang</span> (hieronder dikgedrukt en onderstreept) die bij de persoon (ik/jij/hij...) hoort.
  </div>
  <h3>avoir (hebben)</h3>
  ${tableHTML(['présent','passé composé'], PERSON_LABEL_FR.map(p=>({label:p})), (r,c)=> c===0 ? FR_AVOIR[r] : frPasseCompose('eu')[r])}
  <h3>être (zijn)</h3>
  ${tableHTML(['présent','passé composé'], PERSON_LABEL_FR.map(p=>({label:p})), (r,c)=> c===0 ? FR_ETRE[r] : frPasseCompose('été')[r])}
  <div class="note"><em>avoir</em> en <em>être</em> zijn onregelmatige werkwoorden — hun vormen moet je uit het hoofd leren, ze hebben geen vaste stam+uitgang zoals hieronder. Ook hun eigen passé composé wordt met <em>avoir</em> gevormd: <em>j'ai eu</em>, <em>j'ai été</em>. <em>avoir</em> is bovendien het hulpwerkwoord waarmee de passé composé van de meeste andere werkwoorden gevormd wordt.</div>
  <h3>-er werkwoorden — bijv. parler (praten), stam <em>parl-</em></h3>
  ${tableHTML(['présent','passé composé'], PERSON_LABEL_FR.map(p=>({label:p})), (r,c)=> c===0 ? hl('parl', frPresentER('parl')[r]) : FR_AVOIR[r] + ' ' + hl('parl','parlé'))}
  <h3>-ir werkwoorden — bijv. finir (eindigen), stam <em>fin-</em></h3>
  ${tableHTML(['présent','passé composé'], PERSON_LABEL_FR.map(p=>({label:p})), (r,c)=> c===0 ? hl('fin', frPresentIR('fin')[r]) : FR_AVOIR[r] + ' ' + hl('fin','fini'))}
  <h3>-re werkwoorden — bijv. vendre (verkopen), stam <em>vend-</em></h3>
  ${tableHTML(['présent','passé composé'], PERSON_LABEL_FR.map(p=>({label:p})), (r,c)=> c===0 ? hl('vend', frPresentRE('vend')[r]) : FR_AVOIR[r] + ' ' + hl('vend','vendu'))}
  <div class="note">Het voltooid deelwoord: <em>-er</em> → <em>-é</em>, <em>-ir</em> → <em>-i</em>, <em>-re</em> → <em>-u</em>. Deze cursus gebruikt alleen werkwoorden die <em>avoir</em> als hulpwerkwoord nemen.</div>
  `;
}

/* ================= SHARED: EXPANDABLE CHAPTER > SUB-LESSON VOCAB PICKER ================= */
function renderNestedVocab(chapters, lemmaFn, langCode){
  const wrapId = 'nvoc-' + Math.random().toString(36).slice(2,8);
  setTimeout(()=>initNestedVocab(wrapId, chapters, lemmaFn, langCode), 0);
  const chaptersHtml = chapters.map((c,ci)=>`
    <div class="chapter-block">
      <button class="chapter-header" data-ci="${ci}"><strong>${c.title}</strong><span class="chapter-arrow">▾</span></button>
      <div class="chapter-subs" data-ci="${ci}" style="display:none;">
        ${c.subs.map((s,si)=>`<button class="sub-btn" data-ci="${ci}" data-si="${si}">${s.title} <span>(${s.words.length})</span></button>`).join('')}
      </div>
    </div>`).join('');
  return `<div id="${wrapId}">
    <h2>Kies een hoofdstuk</h2>
    ${chaptersHtml}
    <div data-role="quiz-slot"></div>
  </div>`;
}

function initNestedVocab(wrapId, chapters, lemmaFn, langCode){
  const root = document.getElementById(wrapId);
  if(!root) return;
  const quizSlot = root.querySelector('[data-role="quiz-slot"]');
  root.querySelectorAll('.chapter-header').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const ci = btn.dataset.ci;
      const subsEl = root.querySelector(`.chapter-subs[data-ci="${ci}"]`);
      const opening = subsEl.style.display === 'none';
      subsEl.style.display = opening ? 'flex' : 'none';
      btn.classList.toggle('open', opening);
    });
  });
  root.querySelectorAll('.sub-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      root.querySelectorAll('.sub-btn').forEach(b=>b.classList.toggle('active', b===btn));
      const ci = +btn.dataset.ci, si = +btn.dataset.si;
      const sub = chapters[ci].subs[si];
      const cats = { one: { title: sub.title, sub:'', words: sub.words, vocabOnly:true } };
      quizSlot.innerHTML = renderOefenCategoryPicker(cats, null, lemmaFn, undefined, undefined, undefined, langCode);
    });
  });
}

    const f = {m:['μακροί','μακρῶν','μακροῖς','μακρούς'], f:['μακραί','μακρῶν','μακραῖς','μακράς'], n:['μακρά','μακρῶν','μακροῖς','μακρά']};

  <div class="note">Het vrouwelijk gaat meestal op -η (als bij μάχη), maar na een -ρ, -ε of -ι op -α (als bij χώρα) — de <strong>ρ, ε, ι-regel</strong>.</div>
  <div class="note">Ook bij bijvoeglijke naamwoorden zijn nominativus en accusativus onzijdig altijd gelijk.</div>
  `;
}
function elC4_GebruikBijvNw(){
  return `
  <h3>Gebruik van het bijvoeglijk naamwoord</h3>

  <p><strong>2. Als naamwoordelijk deel van het gezegde</strong> — dan past het zich aan in naamval en geslacht bij het onderwerp: <em>ἡ ὕδρα μεγάλη ἐστὶ καὶ φοβερά</em> — de slang is groot en angstaanjagend.</p>
  <h3>Samengestelde bijvoeglijke naamwoorden</h3>
  <p>Deze bijvoeglijke naamwoorden op -ος (soms -ους) bestaan uit twee delen die elk een eigen betekenis hebben:</p>

  <tr><td>εὔ-νους</td><td>goedgezind</td><td>εὖ (goed) + νοῦς (geest)</td></tr>
  <tr><td>ἄ-δικος</td><td>onrechtvaardig</td><td>ἀ- (on-) + δίκη (recht)</td></tr>
  </tbody></table>
  <div class="note">Deze samengestelde bijvoeglijke naamwoorden hebben geen vrouwelijke uitgang — de mannelijke vorm wordt ook voor het vrouwelijk gebruikt (adjectiva van twee uitgangen).</div>
  `;
}

function elC5_WoordenNietVeranderen(){
  return `
  <h3>Woorden die niet veranderen</h3>
  <p><strong>Voorzetsels</strong> — <em>μετά</em> + gen. samen met; <em>ἐν</em> + dat. in, op, bij; <em>εἰς</em> + acc. naar, naar binnen, tot.</p>
  <p><strong>Bijwoorden</strong> maken duidelijk waar, wanneer of hoe iets gebeurt: <em>ἐνταῦθα</em> daar, <em>αὐτίκα</em> meteen/onmiddellijk, <em>οὕτω(ς)</em> zo/op die manier. Ook bijwoorden die de mate aangeven, zoals <em>μάλα</em> erg/zeer.</p>
  <p><strong>Partikels</strong> leggen een verband tussen twee zinnen of zinsdelen: <em>δέ</em> en/maar (meestal onvertaald, wél na een komma); <em>μέν</em> geeft aan dat er nog een zin komt die met δέ begint (μέν blijft onvertaald); <em>δή</em> dan, dus (geeft nadruk, vaak moeilijk te vertalen); <em>οὖν</em> dan, nu (als een verhaal verdergaat) of dus (in een conclusie).</p>

}

/* ---- Hoofdstuk 6 ---- */
function elC6_Werkwoorden(){
  return `
  <h3>Werkwoorden: infinitivus, stam, persoonsvormen</h3>
  <p>De onbepaalde wijs (infinitivus) gaat uit op -ειν (type λύει, dus λύειν) of -εῖν (type ποιεῖ, dus ποιεῖν) en wordt gebruikt als aanvulling bij bepaalde werkwoorden: <em>σώζειν αὐτὸν ἐθέλει ἡ Ἀριάδνη</em> — Ariadne wil hem redden.</p>
  <p>De werkwoordstam van het type λύει is λυ-; van het type ποιεῖ is ποιε- (eindigt op -ε). Bij de 1e en 2e persoon meervoud staat tussen stam en uitgang een bindvocaal -ο of -ε: λύ-ο-μεν, λύ-ε-τε.</p>
  <div class="note">Bij ποιέω ontstaan ποιοῦμεν (uit ποιέ-ομεν, ε+ο=ου) en ποιεῖτε (uit ποιέ-ετε, ε+ε=ει) door samentrekking.</div>
  ${tableHTML(['λύω (stam λυ-)','ποιέω (stam ποιε-)'], [
    {label:'1e ev.'},{label:'2e ev.'},{label:'3e ev.'},{label:'1e mv.'},{label:'2e mv.'},{label:'3e mv.'},{label:'infinitivus'}
  ], (r,c)=>{
    const luo=['λύω','λύεις','λύει','λύομεν','λύετε','λύουσι(ν)','λύειν'];
    const poieo=['ποιῶ','ποιεῖς','ποιεῖ','ποιοῦμεν','ποιεῖτε','ποιοῦσι(ν)','ποιεῖν'];
    return c===0?luo[r]:poieo[r];
  })}
  <h3>Gebiedende wijs (imperativus)</h3>
  ${tableHTML(['λύω','ποιέω'],[{label:'Enkelvoud'},{label:'Meervoud'}], (r,c)=>{
    const vals=[['λῦε','λύετε'],['ποίει','ποιεῖτε']]; return vals[c][r];
  })}
  <div class="note">Bij een gebiedende wijs gebruikt het Grieks de ontkenning μή in plaats van οὐ(κ). ποιεῖ (hij doet) en ποίει (doe!) herken je aan het verschil in accent.</div>
  <h3>De aangesproken persoon: vocativus</h3>
  <p>Het Grieks gebruikt voor de aangesproken persoon meestal de nominativus, vaak voorafgegaan door ὦ (blijft onvertaald). Woorden op -ος en -ης hebben in het enkelvoud een eigen vocativus-uitgang: ἄνθρωπος → ὦ ἄνθρωπε, δεσπότης → ὦ δέσποτα.</p>
  <div class="note">De vocativus meervoud is altijd gelijk aan de nominativus meervoud.</div>
  <h3>Praesens van εἰμί "zijn"</h3>
  ${tableHTML(['praesens','imperativus','infinitivus'],[
    {label:'1e ev.'},{label:'2e ev.'},{label:'3e ev.'},{label:'1e mv.'},{label:'2e mv.'},{label:'3e mv.'}
  ], (r,c)=>{
    if(c===0) return ['εἰμί','εἶ','ἐστί(ν)','ἐσμέν','ἐστέ','εἰσί(ν)'][r];
    if(c===1) return ['','ἴσθι','','','ἔστε',''][r];
    return ['','','','','',''][r]===''&&r===0 ? 'εἶναι' : '';
  })}
  `;
}

function elC8_Imperfectum(){
  return `

  <p>Om iets uit het verleden mee te delen, gebruikt het Grieks onder andere het <strong>imperfectum</strong>.</p>
  ${tableHTML(['λύω','ποιέω','εἰμί'],[{label:'1e ev.'},{label:'2e ev.'},{label:'3e ev.'},{label:'1e mv.'},{label:'2e mv.'},{label:'3e mv.'}], (r,c)=>{
    const luo=['ἔλυον','ἔλυες','ἔλυε(ν)','ἐλύομεν','ἐλύετε','ἔλυον'];
    const poieo=['ἐποίουν','ἐποίεις','ἐποίει','ἐποιοῦμεν','ἐποιεῖτε','ἐποίουν'];

    return [luo,poieo,eimi][c][r];
  })}
  <div class="note">ἔλυον betekent 1. ik maakte los, 2. zij maakten los (uit de context blijkt welke). Zo ook ἐποίουν: 1. ik deed/maakte, 2. zij deden/maakten.</div>
  <h3>Augment</h3>
  <p>Het voorvoegsel ἐ- dient als signaal voor de verleden tijd en heet het <strong>augment</strong>.</p>
  <div class="note">Bij werkwoorden die beginnen met een ρ wordt de ρ (meestal) verdubbeld: ῥίπτω → ἔρριπτον (gooien, werpen).</div>

function elC8_AugmentBeginklinker(){
  return `

  <table><thead><tr><th>begin</th><th>wordt</th><th>voorbeeld</th></tr></thead><tbody>
  <tr><td>α-</td><td>η-</td><td>ἀκούω → ἤκουον (horen)</td></tr>

  <tr><td>ω</td><td>blijft ω-</td><td>ὠφελέω → ὠφέλουν (helpen)</td></tr>

function elC8_AugmentSamengesteld(){

  <tr><td>ἐπιθυμέω</td><td>:</td><td>ἐπεθύμουν</td></tr>
  <tr><td>ἀναβαίνω</td><td>:</td><td>ἀνέβαινον</td></tr>
  <tr><td>ἐνδύνω</td><td>:</td><td>ἐνέδυνον</td></tr>
  <tr><td>ἀποφέρω</td><td>:</td><td>ἀπέφερον</td></tr>
  </tbody></table>
  <div class="note">Uitzondering: περί → περιέβαινον. Bij πρό kan samentrekking van de -ο en het augment ἐ- optreden: προέβαινον of προὔβαινον.</div>
  <h3>Praesens historicum ("ooggetuigen-praesens")</h3>
  <p>In een verhaal dat zich in het verleden afspeelt, wordt soms een praesens-vorm gebruikt met een ooggetuigen-effect — alsof we er zelf bij zijn: <em>οἱ θεοὶ ἐξαίφνης τὸν ἄνεμον παύουσιν</em> — de goden laten de wind plotseling ophouden.</p>
  `;
}

/* ---- Hoofdstuk 9 ---- */
function elC9_Medeklinkergroep(){
  return `
  <h3>Zelfstandig naamwoord: gemengde groep</h3>
  <p>Alle zelfstandige en bijvoeglijke naamwoorden die niet tot de α/η-groep of de o-groep horen, vallen onder de zogenaamde <strong>gemengde groep</strong>. De stammen van deze groep eindigen soms op een medeklinker, soms op een klinker: de <strong>medeklinkergroep</strong> en de klinkergroep.</p>
  <p>Om de medeklinkergroep te kunnen verbuigen, moet je weten op welke medeklinker de stam eindigt. Die stam-medeklinker is meestal niet in de nominativus te zien, maar wél in de genitivus — daarom staat in woordenboeken altijd de genitivus enkelvoud erbij.</p>
  <div class="note">Uitgangen medeklinkergroep — enkelvoud: — (nom.), -ος (gen.), -ι (dat.), -α (acc.); meervoud: -ες (nom.), -ων (gen.), -σι(ν) (dat.), -ας (acc.).</div>
  ${tableHTML(['ὁ σωτήρ redder','ἡ γυνή vrouw','ὁ λέων leeuw','ὁ πατήρ vader','τὸ σῶμα lichaam'],[
    {label:'nom. ev.'},{label:'gen.'},{label:'dat.'},{label:'acc.'},{label:'nom. mv.'},{label:'gen.'},{label:'dat.'},{label:'acc.'}
  ], (r,c)=>{
    const soter=['σωτήρ','σωτῆρος','σωτῆρι','σωτῆρα','σωτῆρες','σωτήρων','σωτῆρσι(ν)','σωτῆρας'];
    const gyne=['γυνή','γυναικός','γυναικί','γυναῖκα','γυναῖκες','γυναικῶν','γυναιξί(ν)','γυναῖκας'];
    const leon=['λέων','λέοντος','λέοντι','λέοντα','λέοντες','λεόντων','λέουσι(ν)','λέοντας'];
    const pater=['πατήρ','πατρός','πατρί','πατέρα','πατέρες','πατέρων','πατράσι(ν)','πατέρας'];
    const soma=['σῶμα','σώματος','σώματι','σῶμα','σώματα','σωμάτων','σώμασι(ν)','σώματα'];
    return [soter,gyne,leon,pater,soma][c][r];
  })}
  <h3>Dativus meervoud medeklinkergroep</h3>
  <p>De combinatie van de eind-medeklinker van de stam met de -σ- van de uitgang -σι(ν) geeft veranderingen: κ/γ/χ + σ → ξ; τ/δ/θ + σ → σ (τ,δ,θ verdwijnen); π/β/φ + σ → ψ; ν + σ → σ (ν verdwijnt); ντ + σ → σ (ντ verdwijnt, stamklinker verlengd).</p>
  <div class="note">Dativus meervoud van πατήρ, μήτηρ, ἀνήρ, θυγάτηρ gaat uit op -ασι(ν): πατράσι(ν) (uit πατρ-σιν), ἀνδράσι(ν) (uit ἀνδρ-σιν).</div>
  <h3>Bijvoeglijke naamwoorden σώφρων en πᾶς</h3>
  ${tableHTML(['σώφρων mnl./vr.','σώφρων onz.'],[{label:'nom. ev.'},{label:'gen.'},{label:'dat.'},{label:'acc.'},{label:'nom. mv.'},{label:'gen.'},{label:'dat.'},{label:'acc.'}], (r,c)=>{
    const mv=['σώφρων','σώφρονος','σώφρονι','σώφρονα','σώφρονες','σωφρόνων','σώφροσι(ν)','σώφρονας'];
    const onz=['σῶφρον','σώφρονος','σώφρονι','σῶφρον','σώφρονα','σωφρόνων','σώφροσι(ν)','σώφρονα'];
    return c===0?mv[r]:onz[r];
  })}
  ${tableHTML(['mnl.','vrl.','onz.'],[{label:'nom. ev.'},{label:'gen.'},{label:'dat.'},{label:'acc.'},{label:'nom. mv.'},{label:'gen.'},{label:'dat.'},{label:'acc.'}], (r,c)=>{
    const m=['πᾶς','παντός','παντί','πάντα','πάντες','πάντων','πᾶσι(ν)','πάντας'];
    const f=['πᾶσα','πάσης','πάσῃ','πᾶσαν','πᾶσαι','πασῶν','πάσαις','πάσας'];
    const n=['πᾶν','παντός','παντί','πᾶν','πάντα','πάντων','πᾶσι(ν)','πάντα'];
    return [m,f,n][c][r];
  }, 'πᾶς — ieder, geheel, alle(n)')}
  `;
}
function elC9_GemengdBijvNw(){

  <h3>Gemengde groep: bijvoeglijke naamwoorden</h3>
  <p>De gemengde groep bijvoeglijke naamwoorden kent twee types:<br>

/* ---- Hoofdstuk 10 ---- */
function elC10_Aoristus(){
  return `
  <h3>De aoristus</h3>
  <p>Naast de praesensstam (waarmee zowel het praesens als het imperfectum wordt gevormd) heeft het Grieks nog andere werkwoordsstammen. Eén daarvan is de <strong>aoristusstam</strong>, waarmee een verleden tijd, gebiedende wijs/imperativus en infinitivus worden gevormd.</p>
  <h3>Sigmatische aoristus</h3>
  <p>Bij veel werkwoorden wordt de aoristusstam gevormd door -σα (soms -σ) aan de werkwoordstam toe te voegen. Vanwege de -σ- in alle vormen heet dit de <strong>sigmatische aoristus</strong>.</p>
  ${tableHTML(['indicativus','imperativus','infinitivus'],[{label:'1e ev.'},{label:'2e ev.'},{label:'3e ev.'},{label:'1e mv.'},{label:'2e mv.'},{label:'3e mv.'}], (r,c)=>{
    if(c===0) return ['ἔλυσα','ἔλυσας','ἔλυσε(ν)','ἐλύσαμεν','ἐλύσατε','ἔλυσαν'][r];
    if(c===1) return ['','λῦσον','','','λύσατε',''][r];
    return r===0 ? 'λῦσαι' : '';
  }, 'λύω — losmaken')}
  <div class="note">Een aoristus kun je op 3 manieren vertalen: ἔλυσα = 1. ik maakte los, 2. ik heb losgemaakt, 3. ik had losgemaakt.</div>
  <h3>Aoristus van ε-werkwoorden (type ποιέω)</h3>
  <p>Bij werkwoorden van het type ποιε- komt -σ(α)- achter de verlengde stamklinker: ἐποίησα. Uitzonderingen: καλέω → ἐκάλεσα, δοκέω → ἔδοξα. Ook ἐθέλω (geen ε-werkwoord!) heeft aoristus ἠθέλησα.</p>
  `;
}
function elC10_AoristusMedeklinker(){
  return `
  <h3>Vorming aoristus bij medeklinkerstam</h3>
  <p>De stam van een werkwoord eindigt vaak op een medeklinker. De combinatie van de σ van -σ(α)- met de eind-medeklinker van de werkwoordstam geeft veranderingen:</p>
  <table><thead><tr><th>medeklinker</th><th>voorbeeld</th><th>stam</th><th>aoristus</th></tr></thead><tbody>
  <tr><td rowspan="2">π/β/φ/πτ + σ → ψ</td><td>βλέπω</td><td>βλεπ-</td><td>ἔβλεψα</td></tr>
  <tr><td>τύπτω</td><td>τυπ-</td><td>ἔτυψα</td></tr>
  <tr><td rowspan="2">κ/γ/χ/ττ + σ → ξ</td><td>διώκω</td><td>διωκ-</td><td>ἐδίωξα</td></tr>
  <tr><td>λέγω</td><td>λεγ-</td><td>ἔλεξα</td></tr>
  <tr><td rowspan="2">τ/δ/θ/ζ + σ → σ</td><td>νομίζω</td><td>νομιδ-</td><td>ἐνόμισα</td></tr>
  <tr><td>πείθω</td><td>πειθ-</td><td>ἔπεισα</td></tr>
  </tbody></table>
  <div class="note">τ, δ, θ, ζ verdwijnen dus voor de σ.</div>
  <h3>Gebruik aoristus</h3>
  <p>Een aoristusstam stelt een gebeurtenis voor als <strong>afgesloten</strong> (constaterend): <em>οἱ Τρῶες τῶν Ἀχαιῶν ἐκράτησαν</em> — de Trojanen hebben de Grieken overwonnen (met nadruk op de geslaagde overwinning).</p>
  <p>Een praesens of imperfectum stelt een gebeurtenis voor als <strong>niet-afgesloten</strong>: een herhaalde handeling, gewoonte of achtergrondgebeurtenis: <em>οἱ Τρῶες τῶν Ἀχαιῶν ἐκράτουν</em> — de Trojanen waren bezig de Grieken te overwinnen (nog onduidelijk of het lukt).</p>
  `;
}
function elC10_PseudoSigmatisch(){
  return `
  <h3>Pseudo-sigmatische aoristus</h3>
  <p>Werkwoorden waarvan de stam uitgaat op μ, λ, ν of ρ (de medeklinkers van "molenaar") hebben geen sigmatische, maar een <strong>pseudo-sigmatische</strong> aoristus: deze heeft de uitgangen van de sigmatische aoristus, maar de σ ontbreekt! Je herkent 'm meestal aan de verlengde werkwoordstam:</p>
  <table><tbody>
  <tr><td>ἀγγέλλω (berichten)</td><td>:</td><td>ἤγγειλα (stam ἀγγελ-)</td></tr>
  <tr><td>μένω (blijven)</td><td>:</td><td>ἔμεινα (stam μεν-)</td></tr>
  <tr><td>αἴρω (optillen)</td><td>:</td><td>ἦρα (stam ἀρ-)</td></tr>
  </tbody></table>
  ${tableHTML(['indicativus','imperativus','infinitivus'],[{label:'1e ev.'},{label:'2e ev.'},{label:'3e ev.'},{label:'1e mv.'},{label:'2e mv.'},{label:'3e mv.'}], (r,c)=>{
    if(c===0) return ['ἤγγειλα','ἤγγειλας','ἤγγειλε(ν)','ἠγγείλαμεν','ἠγγείλατε','ἤγγειλαν'][r];

  }, 'ἀγγέλλω — berichten')}
  <div class="note">Je ziet geen onderscheid tussen praesens- en aoristusstam bij -ει-, -ι- en -υ- in de praesensstam: ἀποκτείνω → ἀπέκτεινα, κρίνω → ἔκρινα.</div>
  <h3>Thematische aoristus</h3>
  <p>De meeste werkwoorden hebben een sigmatische aoristus. Een groot aantal andere, veelvoorkomende werkwoorden heeft een aoristus met een <em>andere stam</em> dan het praesens. De vervoeging verloopt dan als bij de praesensstam van het type λύω. Omdat de themavocaal -ε/ο optreedt, heet dit de <strong>thematische aoristus</strong> — deze moet je apart aan de stam leren:</p>
  ${tableHTML(['indicativus','imperativus','infinitivus'],[{label:'1e ev.'},{label:'2e ev.'},{label:'3e ev.'},{label:'1e mv.'},{label:'2e mv.'},{label:'3e mv.'}], (r,c)=>{

  `;

/* ---- Hoofdstuk 12 ---- */
function elC12_Trappen(){
  return `
  <h3>Comparativus (vergrotende trap)</h3>
  <p>Op <strong>-τερος</strong>: de comparativus van de meeste bijvoeglijke naamwoorden gaat uit op -τερος, -τέρα, -τερον, bijv. δειλότερος (laffer), en wordt verbogen als μακρός.</p>
  <p>Op <strong>-(ί)ων</strong>: een aantal veelvoorkomende bijvoeglijke naamwoorden heeft de uitgang -(ί)ων (gen. -ονος) voor mannelijk/vrouwelijk en -(ι)ον voor onzijdig, bijv. βελτίων, βέλτιον (beter) — verbogen als σώφρων.</p>
  <h3>Superlativus (overtreffende trap)</h3>
  <p>Op <strong>-τατος</strong>: de superlativus van de meeste bijvoeglijke naamwoorden gaat uit op -τατος, -τάτη, -τατον, bijv. σοφώτατος (wijste, slimste) — verbogen als δεινός.</p>
  <p>Op <strong>-ιστος</strong>: bijvoeglijke naamwoorden waarvan de comparativus op -(ί)ων uitgaat, hebben een superlativus op -ιστος, -ίστη, -ιστον, bijv. βέλτιστος (beste) — verbogen als δεινός.</p>
  `;
}
function elC12_GebruikTrappen(){
  return `
  <h3>Gebruik comparativus</h3>
  <p><strong>1. In vergelijkingen</strong>: de persoon/zaak waarmee vergeleken wordt, staat na ἤ (dan) óf in de genitivus (zonder ἤ!) — de genitivus comparationis: <em>τίς ἐστι δειλότερος ἢ σύ;</em> wie is er laffer dan jij? / <em>τίς ἐστιν ἀνδρειότερος ἐμοῦ;</em> wie is er dapperder dan ik?<br>
  <strong>2.</strong> Bij het vergelijken van twee personen/zaken drukt de comparativus de hoogste graad uit: <em>πότερος ἀμείνων ἐστίν;</em> wie van beiden is beter?<br>
  <strong>3.</strong> Zonder vergelijking vertaal je de comparativus vaak met "nogal", "tamelijk", "al te": <em>ὁ Ὀδυσσεὺς σοφώτερος ἦν</em> Odysseus was nogal slim.</p>
  <h3>Gebruik superlativus</h3>
  <p><strong>1. In vergelijkingen</strong>: de persoon/zaak waarmee vergeleken wordt staat vaak in de genitivus: <em>βέλτιστος πάντων Ἀχαιῶν</em> de beste van alle Grieken.<br>
  <strong>2.</strong> Zonder vergelijking vertaal je de superlativus vaak met "zeer...", "heel...": <em>τοῖς ἀνδρειοτάτοις ἔργοις</em> door zeer/heel dappere daden.<br>
  <strong>3.</strong> Voorafgegaan door ὡς/ὅτι: "zo... mogelijk": <em>πρόβατα ὡς πλεῖστα</em> zoveel mogelijk schapen.</p>
  <div class="note">De genitivus bij een comparativus (zonder ἤ) moet je vertalen met "dan": μείζων ἐμοῦ groter dan ik.</div>
  `;
}

/* ---- Hoofdstuk 13 ---- */
function elC13_Aanwijzend(){
  return `
  <h3>Aanwijzende voornaamwoorden</h3>
  <p>Het Grieks kent drie aanwijzende voornaamwoorden: ὅδε (deze), οὗτος (deze, die) en ἐκεῖνος (die). Ze kunnen zowel zelfstandig ("los") als bijvoeglijk gebruikt worden.</p>
  <p><strong>Bijvoeglijk gebruik</strong>: komen overeen in geslacht, getal en naamval met het zelfstandig naamwoord, en staan vóór lidwoord + zelfstandig naamwoord of erachter.<br>
  <strong>Zelfstandig gebruik</strong>: als persoonlijk voornaamwoord van de 3e persoon.</p>
  <p>ὅδε, ἥδε, τόδε (1. deze, 2. hij/zij/dit hier) wordt verbogen als het lidwoord + δε. οὗτος, αὕτη, τοῦτο (1. deze/die, 2. hij/zij/dat hier/daar) — let op: een τ wordt toegevoegd waar ook het lidwoord met τ begint; bij een o-klank is de stam ουτ, bij een α/η-klank is de stam αυτ. ἐκεῖνος, ἐκείνη, ἐκεῖνο (die, hij/zij/dat daar) wordt verbogen als δεινός, met uitzondering van nom./acc. onzijdig enkelvoud: -ο i.p.v. -ον.</p>
  ${tableHTML(['ὅδε mnl.','ἥδε vrl.','τόδε onz.'],[{label:'nom. ev.'},{label:'gen.'},{label:'dat.'},{label:'acc.'},{label:'nom. mv.'},{label:'gen.'},{label:'dat.'},{label:'acc.'}], (r,c)=>{

    const f=['ἥδε','τῆσδε','τῇδε','τήνδε','αἵδε','τῶνδε','ταῖσδε','τάσδε'];
    const n=['τόδε','τοῦδε','τῷδε','τόδε','τάδε','τῶνδε','τοῖσδε','τάδε'];

  ${tableHTML(['οὗτος mnl.','αὕτη vrl.','τοῦτο onz.'],[{label:'nom. ev.'},{label:'gen.'},{label:'dat.'},{label:'acc.'},{label:'nom. mv.'},{label:'gen.'},{label:'dat.'},{label:'acc.'}], (r,c)=>{
    const m=['οὗτος','τούτου','τούτῳ','τοῦτον','οὗτοι','τούτων','τούτοις','τούτους'];
    const f=['αὕτη','ταύτης','ταύτῃ','ταύτην','αὗται','τούτων','ταύταις','ταύτας'];
    const n=['τοῦτο','τούτου','τούτῳ','τοῦτο','ταῦτα','τούτων','τούτοις','ταῦτα'];
    return [m,f,n][c][r];
  })}
  ${tableHTML(['ἐκεῖνος mnl.','ἐκείνη vrl.','ἐκεῖνο onz.'],[{label:'nom. ev.'},{label:'gen.'},{label:'dat.'},{label:'acc.'},{label:'nom. mv.'},{label:'gen.'},{label:'dat.'},{label:'acc.'}], (r,c)=>{

function elC13_ACI(){
  return `
  <h3>Accusativus cum Infinitivo (A.c.I.)</h3>
  <p>Vergelijk: <em>οὐ γιγνώσκετε ὅτι οἱ Ἀχαιοὶ ἄπιστοί εἰσιν;</em> (met ὅτι-zin) en <em>οὐ γιγνώσκετε τοὺς Ἀχαιοὺς ἀπίστους εἶναι;</em> (met A.c.I.) — begrijpen jullie niet dat de Grieken onbetrouwbaar zijn? In de A.c.I.-zin is τοὺς Ἀχαιούς accusativus en onderwerp van de infinitivus εἶναι.</p>
  <p>De A.c.I. wordt gebruikt als alternatief voor de ὅτι-zin bij werkwoorden die "zeggen", "menen", "horen" e.d. betekenen. Het onderwerp van de infinitivus is <strong>niet gelijk</strong> aan het onderwerp van de persoonsvorm en staat altijd in de accusativus.</p>
  <h3>A.c.I. bij onpersoonlijke uitdrukkingen</h3>
  <p>Bij sommige onpersoonlijke uitdrukkingen wordt de A.c.I. als geheel als onderwerp gebruikt: <em>οὐ χρὴ ὑμᾶς ἕλκειν τὸν ἵππον</em> het is niet nodig dat jullie het paard slepen = jullie moeten het paard niet slepen. <em>δῆλόν ἐστι τὸν ἵππον κακὰ φέρειν</em> het is duidelijk dat het paard ellende meebrengt.</p>
  <h3>Subjectsaccusativus en objectsaccusativus</h3>
  <p>In een zin als <em>δῆλόν ἐστι τὸν ἵππον πολλὰ κακὰ ὑμῖν φέρειν</em> staan twee accusativi: τὸν ἵππον (subjectsaccusativus, onderwerp van φέρειν) en πολλὰ κακά (objectsaccusativus, lijdend voorwerp van φέρειν).</p>
  <h3>Infinitivi in de A.c.I.</h3>
  <p>Let op of een infinitivus van het praesens of van de aoristus wordt gebruikt:<br>
  <strong>a. Praesens-infinitivus</strong>: gelijktijdig met de persoonsvorm — <em>ἆρ' οὐ γιγνώσκετε ἐκείνους ἀπιστοτάτους εἶναι;</em> begrijpen jullie niet dat zij zeer onbetrouwbaar zíjn?<br>
  <strong>b. Aoristus-infinitivus</strong>: voortijdig (eerder dan de persoonsvorm) — <em>ἆρ' οὐ γιγνώσκετε τοὺς Ἀχαιοὺς τὸν ἵππον δόλῳ δεῦρο ἀγαγεῖν;</em> begrijpen jullie niet dat de Grieken het paard met list hierheen híjbben gebracht?</p>
  `;
}

const PERSON_LABEL_EL = ['ik','jij','hij/zij/het','wij','jullie','zij'];

function elDeclOefenen(words, title){
  const cats = { one: { title: title||'Vormen', sub:'', words, forms: (w)=>w.forms } };
  return renderOefenCategoryPicker(cats, (word, formKey)=>{
    const caseKey = formKey.slice(0,3); const number = formKey.slice(3);
    return `Wat is de vorm in de <strong>${EL_CASE_LABEL[caseKey]} ${NUM_LABEL[number]}</strong> van <span class="w">${word.gr}</span> (${word.nl})?`;
  }, (w)=>w.gr, (word, formKey)=>{
    const caseKey = formKey.slice(0,3); const number = formKey.slice(3);
    return `${EL_CASE_LABEL[caseKey]} ${NUM_LABEL[number]}`;
  }, undefined, undefined, 'EL');
}
function elConjOefenen(verbs, title){
  const cats = { one: { title: title||'Vervoeging', sub:'', words: verbs, forms: (w)=>w.forms } };
  return renderOefenCategoryPicker(cats, (word, formKey)=>{
    const p = +formKey.slice(1);

}
